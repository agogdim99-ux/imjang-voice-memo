<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>집노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --soft:#F6F8FB; --line:#E4E8EF; --line2:#EEF1F5;
  --ink:#0F172A; --ink2:#475467; --muted:#98A2B3;
  --blue:#1747D6; --blue-ink:#1239AE; --blue-soft:#EAF0FF; --blue-line:#C9D7FF;
  --ok:#0F8A4F; --ok-bg:#E6F6EE; --warn:#B26B00; --warn-bg:#FFF4DC; --bad:#C2262E; --bad-bg:#FDECEC; --na:#667085; --na-bg:#F0F2F5;
  --need:#B25E09; --need-bg:#FFF3E3;
  --r:16px; --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05);
  --sans:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{width:22px;height:22px;flex:none}
.muted{color:var(--muted)} .small{font-size:13px} .row{display:flex;align-items:center;gap:8px}

/* 레이아웃: 폰 = 한 줄, PC = 왼쪽 메뉴 + 본문 */
.app{min-height:100dvh}
.side{display:none}
.main{max-width:520px;margin:0 auto;background:var(--surface);min-height:100dvh;position:relative}
main{padding:8px 20px 110px}
@media (min-width:1024px){
  .app{display:grid;grid-template-columns:232px 1fr}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh;padding:28px 16px;background:var(--surface);border-right:1px solid var(--line)}
  .side .logo{font-size:26px;margin:0 10px 22px}
  .side a,.side button{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:var(--ink2);font-weight:600;text-align:left}
  .side a.on{background:var(--blue-soft);color:var(--blue)}
  .side a:hover,.side button:hover{background:var(--soft)}
  .main{max-width:1180px;margin:0;background:var(--bg)}
  main{padding:28px 36px 60px}
  nav.tabs{display:none!important}
}
.logo{font-weight:900;color:var(--blue);letter-spacing:-.04em}

/* 공통 */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 4px}
.top .logo{font-size:28px}
.iconbtn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--ink)}
.iconbtn:active{background:var(--soft)}
.badge{position:absolute;top:5px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--blue);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}
.lead{font-size:18px;font-weight:600;color:var(--ink2);line-height:1.45;margin:6px 0 18px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:14px;background:var(--blue);color:#fff;font-weight:800;font-size:17px}
.btn:active{background:var(--blue-ink)}
.btn.xl{height:68px;font-size:21px;justify-content:space-between;padding:0 22px}
.btn.xl .ic{width:28px;height:28px}
.btn.sm{height:46px;font-size:15px;border-radius:12px}
.btn.line{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-weight:700}
.btn.line.blue{color:var(--blue);border-color:var(--blue-line)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.duo .btn{height:50px;font-size:14.5px;font-weight:700;justify-content:center}

.panel{background:var(--soft);border-radius:var(--r);padding:16px;margin-top:16px}
.panelhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.panelhd h2{font-size:18px;margin:0;font-weight:800}
.more{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:2px}
.pcard{display:flex;align-items:center;gap:10px;padding:15px 16px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);margin-top:8px;width:100%;text-align:left}
.pcard:active{background:var(--soft)}
.pcard .t{flex:1;min-width:0}
.pcard b{display:block;font-size:17px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard span.s{font-size:14px;color:var(--ink2)}
.chev{width:18px;height:18px;color:var(--ink2);flex:none}
.st{font-size:12.5px;font-weight:800;line-height:1.2;padding:5px 10px;border-radius:8px;background:var(--blue-soft);color:var(--blue);white-space:nowrap;flex:none;align-self:center}
@media (min-width:1024px){ .phd.det{display:none} }
.st.plan{background:#fff;border:1.5px solid var(--blue-line)}
.st.smp{background:var(--na-bg);color:var(--na)}
.zt{font-size:12px;font-weight:800;padding:3px 8px;border-radius:7px;white-space:nowrap}
.zA,.zC{background:var(--bad-bg);color:var(--bad)} .zB{background:var(--ok-bg);color:var(--ok)} .zq{background:var(--na-bg);color:var(--na)}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:14px}
.note{display:flex;gap:8px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:12px 14px;color:var(--ink2);font-size:13px;margin-top:12px}

/* 하단 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs a,nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:12px;color:var(--ink2);font-weight:600}
nav.tabs .on{color:var(--blue);font-weight:800}

/* 페이지 머리 */
.phd{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin:4px -6px 10px}
.phd h1{font-size:19px;margin:0;text-align:center;font-weight:800}
@media (min-width:1024px){ .phd{grid-template-columns:0 1fr 40px;margin-bottom:18px} .phd h1{text-align:left;font-size:26px} .phd .back{visibility:hidden} }
.pills{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.pill{position:relative;display:inline-flex;align-items:center;height:42px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;white-space:nowrap}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pill select{position:absolute;inset:0;opacity:0;cursor:pointer}
.sep{color:var(--ink2);font-weight:700}
.ftabs{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.ftab{height:40px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink2);font-weight:700;white-space:nowrap}
.ftab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.fab{position:fixed;right:max(18px,calc(50vw - 242px));bottom:84px;width:62px;height:62px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(23,71,214,.35);z-index:15}
@media (min-width:1024px){.fab{display:none}}

/* 상세 */
.crumb{font-size:12.5px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dtop{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-top:6px}
.dtop .ttl{flex:1;min-width:220px}
.dtop h1{font-size:26px;margin:0;font-weight:900;letter-spacing:-.03em;line-height:1.25}
.dtop .sub{font-size:15px;color:var(--ink2);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dact{display:flex;gap:8px}
.dact .btn{width:auto;height:46px;padding:0 16px;font-size:14.5px}
@media (max-width:1023px){ .dact{width:100%} .dact .btn{flex:1} }
.hero{margin:14px -20px 0;position:relative;background:#E8EDF5;overflow:hidden}
@media (min-width:1024px){ .hero{margin:16px 0 0;border-radius:var(--r)} }
.hero .lbl{position:absolute;right:10px;bottom:8px;font-size:11.5px;background:rgba(15,23,42,.55);color:#fff;padding:3px 8px;border-radius:6px}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:240px}
.gallery .ph{position:relative;flex:0 0 100%;scroll-snap-align:center} .gallery img{width:100%;height:240px;object-fit:cover;display:block}
@media (min-width:1024px){ .gallery,.gallery img{height:300px} .gallery .ph{flex-basis:60%} .gallery .ph:only-child{flex-basis:100%} }
.mainph{display:block;width:100%;padding:0} .mainph img{width:100%;height:260px;object-fit:cover;display:block}
@media (min-width:1024px){ .mainph img{height:340px} }
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.th{flex:none;width:68px;height:68px;border-radius:12px;overflow:hidden;border:2px solid transparent;background:var(--soft);padding:0;cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block} .th.on{border-color:var(--blue)}
.th.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px dashed var(--blue-line);color:var(--blue);font-size:12px;font-weight:800}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:none;align-items:center;justify-content:center}
.viewer.open{display:flex} .viewer img{max-width:100%;max-height:82dvh;object-fit:contain}
.vbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:14px 20px calc(14px + env(safe-area-inset-bottom));color:#fff;font-weight:700}
.vbar button{color:#fff;font-weight:800;padding:8px 6px}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;color:#fff;font-size:40px;font-weight:300}
.vnav.l{left:4px} .vnav.r{right:4px}
ol.sents{margin:4px 0 0;padding-left:22px} ol.sents li{padding:5px 0;font-size:15px;line-height:1.55;border-bottom:1px solid var(--line2)} ol.sents li:last-child{border-bottom:0}
ol.sents li::marker{color:var(--blue);font-weight:800;font-size:13px}
details.orig{margin-top:10px} details.orig summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink2)} details.orig p{font-size:13.5px;color:var(--muted);white-space:pre-wrap;margin:8px 0 0}
.shotprev{width:100%;border:1px solid var(--line);border-radius:10px;display:block;margin-top:6px;max-height:52dvh;object-fit:contain;background:#fff}
/* 한 페이지(A4) 모양: 화면에서 캡처하거나 인쇄할 때 같이 쓴다 (A4 폭 = 794px) */
#printpage{display:none;width:794px;padding:40px 42px;background:#fff;font-size:12.6px;color:#0F172A;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printpage.capture{display:block;position:fixed;left:-10000px;top:0;z-index:-1}
#printpage header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid var(--blue);padding-bottom:6px;margin-bottom:8px}
#printpage .pl{font-size:11.3px;color:var(--blue);font-weight:800} #printpage h1{font-size:22.7px;margin:2px 0;font-weight:900}
#printpage .pa{font-size:12.0px;color:#475467} #printpage .pd{text-align:right;font-size:11.3px;color:#475467}
#printpage .pphotos{display:grid;gap:4px;margin-bottom:8px} .pphotos.n1{grid-template-columns:1fr} .pphotos.n2{grid-template-columns:1fr 1fr} .pphotos.n3,.pphotos.n4{grid-template-columns:repeat(4,1fr)}
#printpage .pphotos img{width:100%;height:42mm;object-fit:cover;border-radius:4px} .pphotos.n1 img{height:55mm}
#printpage .card{margin:0 0 8px;padding:8px 10px;border:1px solid #E4E8EF;border-radius:8px;break-inside:avoid;box-shadow:none;background:#fff}
#printpage .pcols{display:grid;grid-template-columns:1fr 1.25fr 0.9fr;gap:6px;align-items:start}
#printpage .pcols .pane{display:block!important}
#printpage .ul-sm,#printpage .fine{display:none!important}
#printpage .need-box{display:block!important;padding:4px 6px} #printpage .pricegrid{gap:3px 6px}
#printpage .cardhd{font-size:14.0px;margin-bottom:4px} #printpage button,#printpage .edit-btn,#printpage .cond{display:none!important}
#printpage table.info th,#printpage table.info td{padding:3px 6px;font-size:11.7px} #printpage table.info th{width:62px}
#printpage .memo .lab{font-size:13.3px;margin:8px 0 2px} #printpage ul.olist li{padding:2px 0;font-size:11.7px;border:0}
#printpage .htag{font-size:11.3px;padding:2px 7px} #printpage ul.todo li{padding:1px 0 1px 18px;font-size:11.7px} #printpage ul.todo li::before{top:4px;width:9px;height:9px}
#printpage .scen{border:0;padding:3px 0} #printpage .scen .v{font-size:17.3px} #printpage .scen .d{font-size:10.0px}
#printpage .pillv{font-size:10.4px;padding:2px 6px} #printpage .pricebox{padding:4px 8px} #printpage .pricebox b{font-size:16.0px}
#printpage footer{margin-top:6px;font-size:10.0px;color:#98A2B3;text-align:center}
@media print {
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  .app,.sheet,.scrim,.toast,nav.tabs,.viewer,.fab,.shot{display:none!important}
  #printpage{display:block!important;position:static!important}
}
.phdel{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(15,23,42,.55);color:#fff;font-size:18px}
.mapbox{height:220px} .mapbox iframe{width:100%;height:100%;border:0;display:block}
@media (min-width:1024px){ .mapbox{height:300px} }
.illus{height:180px} .illus svg{width:100%;height:100%}
.photobar{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.chip{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink2);font-weight:700;font-size:13.5px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dtabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1.5px solid var(--line);margin-top:18px;position:sticky;top:0;background:var(--surface);z-index:5}
@media (min-width:1024px){ .dtabs{background:var(--bg)} }
.dtabs button{padding:13px 0;font-weight:700;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1.5px;font-size:15.5px}
.dtabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.cols{display:block}
.pane{display:none} .pane.on{display:block}
@media (min-width:1024px){ .cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:start;margin-top:14px} .pane{display:block} }
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
@media (min-width:1024px){ .cols .card{margin-top:0} }
.cardhd{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:16px;margin-bottom:10px}
.cardhd .src{font-size:12px;font-weight:600;color:var(--muted)}
.edit-btn{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--ink2);border:1.5px solid var(--line);border-radius:8px;padding:4px 8px}
table.info{width:100%;border-collapse:collapse;font-size:14px}
table.info th{width:84px;text-align:left;font-weight:600;color:var(--ink2);background:var(--soft);padding:10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.info td{padding:10px;border-bottom:1px solid var(--line2);font-weight:600}
table.info tr:last-child th,table.info tr:last-child td{border-bottom:0}
.needtxt{color:var(--need);font-weight:700}
.memo ul{margin:6px 0 0;padding-left:18px} .memo li{margin:5px 0;font-size:14.5px}
.memo .lab{font-size:12.5px;font-weight:800;color:var(--ink2);margin-top:12px}
.memo .sum{font-size:15px;line-height:1.65;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--need-bg);color:var(--need);font-weight:700}
.pricegrid{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.pricegrid span{font-size:14px;color:var(--ink2);font-weight:600}
.pricebox{background:var(--blue-soft);border-radius:10px;padding:10px 12px;text-align:right}
.pricebox b{font-size:22px;font-weight:900;color:var(--blue)} .pricebox small{display:block;font-size:11px;color:var(--ink2)}
.need-box{margin-top:12px;background:var(--soft);border-radius:12px;padding:12px}
.scen{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.scen:last-child{border-bottom:0}
.scen .nm{font-size:12.5px;color:var(--ink2);font-weight:700} .scen .v{font-size:24px;font-weight:900;color:var(--blue);letter-spacing:-.03em}
.scen .na{font-size:14.5px;font-weight:800;color:var(--na)} .scen .d{font-size:12px;color:var(--muted)}
.pillv{font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:999px;white-space:nowrap}
.pillv.ok{background:var(--ok-bg);color:var(--ok)} .pillv.warn{background:var(--warn-bg);color:var(--warn)} .pillv.bad{background:var(--bad-bg);color:var(--bad)}
.cond{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px}
.fine{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.55}
.ul-sm{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)}
details.raw{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);padding:2px 16px;background:var(--surface)}
details.raw summary{padding:13px 0;font-weight:700;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
details.raw p{font-size:14px;color:var(--ink2);margin:0 0 12px;white-space:pre-wrap}
details.srcs{margin-top:10px;font-size:12.5px} details.srcs summary{cursor:pointer;color:var(--ink2);font-weight:700}
details.srcs a{display:block;color:var(--blue);padding:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.danger{color:var(--bad);font-weight:700;font-size:14px;padding:8px 0}
.link{color:var(--blue);font-weight:700;font-size:14px;padding:8px 0}
.spinner{width:34px;height:34px;margin:0 auto;border-radius:50%;border:4px solid var(--blue-soft);border-top-color:var(--blue);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
textarea.edit,input.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15.5px;line-height:1.6;background:var(--surface)}
textarea.edit{min-height:150px;resize:vertical}
textarea.edit:focus,input.field:focus{outline:none;border-color:var(--blue)}
.steps2{margin:4px 0 12px;padding-left:20px;font-size:13.5px;color:var(--ink2)} .steps2 li{margin:4px 0}

/* 녹음 정리 */
.glance{margin-top:14px;border-color:var(--blue-line);background:linear-gradient(180deg,#F7F9FF,#fff)}
.htags{display:flex;flex-wrap:wrap;gap:6px}
.htag{font-size:13.5px;font-weight:800;padding:6px 11px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.htag.warn{background:var(--bad-bg);color:var(--bad)}
.recb{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:800;color:var(--blue);background:var(--blue-soft);border-radius:5px;padding:1px 5px;vertical-align:1px}
table.info td{line-height:1.5}
ul.todo{list-style:none;margin:6px 0 0;padding:0;font-size:14.5px}
ul.todo li{position:relative;padding:5px 0 5px 24px;color:var(--ink)}
ul.todo li::before{content:"";position:absolute;left:2px;top:9px;width:13px;height:13px;border:2px solid var(--blue);border-radius:4px}
.memo .lab{font-size:17px;font-weight:800;color:var(--ink);margin:20px 0 6px;padding-left:10px;border-left:4px solid var(--blue);line-height:1.25}
.memo .lab:first-of-type{margin-top:6px}
ul.olist{list-style:none;margin:0;padding:0}
ul.olist li{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid var(--line2);font-size:15px;line-height:1.55}
ul.olist li:last-child{border-bottom:0}
.mi,.mk{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;margin-top:1px;border-radius:6px;font-size:14px;font-weight:900;line-height:1;background:var(--na-bg);color:var(--na)}
.mk{width:18px;height:18px;font-size:12px;vertical-align:-3px;margin:0 2px 0 0}
li.neu .mi{background:transparent;color:var(--muted);font-size:18px}
li.pos .mi,.mk.pos{background:var(--ok-bg);color:var(--ok)} li.neg .mi,.mk.neg{background:var(--bad-bg);color:var(--bad)} li.mix .mi,.mk.mix{background:var(--warn-bg);color:var(--warn)}

/* 기록·내 정보 */
.optgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.lab2{font-size:13px;font-weight:800;color:var(--ink2);margin-top:14px}
.tblwrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:12px}
table.cmp{border-collapse:collapse;font-size:13px;min-width:600px;width:100%;background:var(--surface)}
table.cmp th,table.cmp td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}
table.cmp th{background:var(--soft);font-weight:800}
table.cmp td:first-child,table.cmp th:first-child{position:sticky;left:0;background:var(--soft);color:var(--ink2);font-weight:700}
table.cmp td.need{color:var(--need);font-weight:700}
.search{display:flex;align-items:center;gap:8px;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface)}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:15px}

/* 바텀시트 */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;transform:translateY(105%);transition:transform .28s ease;z-index:50}
@media (min-width:1024px){ .sheet{bottom:auto;top:50%;border-radius:20px;transform:translateY(-40%) scale(.98);opacity:0;pointer-events:none;transition:.2s} .sheet.open{transform:translateY(-50%);opacity:1;pointer-events:auto} }
.sheet.open{transform:none} .scrim.open{display:block}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:21px;margin:2px 0 6px;font-weight:900}
.recmain{display:flex;flex-direction:column;align-items:center;gap:10px;margin:12px 0 8px}
.bigmic{width:96px;height:96px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 10px 28px rgba(23,71,214,.35)}
.bigmic .ic{width:38px;height:38px}
.bigmic.on{background:var(--bad);box-shadow:0 0 0 10px rgba(194,38,46,.14);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(194,38,46,.05)}}
.rectime{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink2);font-size:14px;text-align:center}
.recdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.live{min-height:110px;max-height:32dvh;overflow-y:auto;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:15.5px;line-height:1.6}
.live .interim{color:var(--muted)} .live:empty::before{content:attr(data-ph);color:var(--muted)}
.hint{background:var(--blue-soft);color:var(--blue-ink);border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.btnrow{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:12px}
details.tips summary{list-style:none;cursor:pointer;font-weight:800;font-size:13px;color:var(--ink2);padding:14px 0 4px}
.tip{font-size:13px;color:var(--ink2);margin:4px 0 0;padding-left:18px} .tip li{margin:3px 0}
.sample{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.play{width:38px;height:38px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.sample .s{flex:1;min-width:0} .sample b{display:block;font-size:14.5px} .sample small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1}
</style>
</head>

    <a href="#/records" data-t="records"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>임장 기록</a>

    <a href="#/region" data-t="region"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>매물</a>
    <button data-act="rec"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>녹음</button>

    <a href="#/me" data-t="me"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>내 정보</a>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script>
'use strict';
/* ═════════ 저장소 · 데이터 ═════════ */
const D = window.ZIPNOTE_DATA || {properties: []};
const store = {
  get(k, d){ try { const v = localStorage.getItem('zipnote.'+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('zipnote.'+k, JSON.stringify(v)); return true; } catch(e){ toast('저장 공간이 부족해요'); return false; } }
};
let S = store.get('settings', {seed:2, buyer:'무주택', income:0, samples:true});
if (S.samples === undefined) S.samples = true;
const SAMPLES = D.properties.map(p => ({...p, sample:true, visit:'done'}));
let MINE = store.get('mine', []);
for (const p of MINE) {
  if (!p.visit) p.visit = p.transcript ? 'done' : 'planned';
  if (p.status === 'analyzing') { p.status = 'error'; p.error = '정리가 중간에 멈췄어요. 다시 시도해 주세요.'; }
  if (p.transcript && !p.ai && !p.fixed) { p.fixed = true; const a = ZipEngine.analyze(ZipEngine.fixSTT(p.transcript)); if (!p.custom_name) p.complex_name = a.complex_name; }   // 예전 기록: 새 이름 인식 규칙으로 다시
  if (p.complex_name === undefined && p.transcript) { const a = ZipEngine.analyze(p.transcript); p.complex_name = a.complex_name; if (!p.sido && a.sido) { p.sido=a.sido; p.sigungu=a.sigungu; p.zone=a.zone; } }
}
let P = [], byId = {};
function saveMine(){ store.set('mine', MINE); }
function reload(){ P = MINE.slice().sort((a,b)=>(b.updated||b.created)-(a.updated||a.created)).concat(S.samples ? SAMPLES : []); byId = Object.fromEntries(MINE.concat(SAMPLES).map(p=>[p.id,p])); }
saveMine(); reload();
const recent = () => { const r = store.get('recent', []), ids = P.map(p=>p.id); return r.filter(id=>ids.includes(id)).concat(ids.filter(id=>!r.includes(id))); };

function newProp(extra){ const p = {id:'u'+Date.now(), sample:false, created:Date.now(), transcript:'', photos:[], ...extra}; MINE.push(p); saveMine(); reload(); return p; }
function saveNew(text){ const fixed = ZipEngine.fixSTT(text); const a = ZipEngine.analyze(fixed); return newProp({...a, transcript:fixed, raw_transcript:text, visit:'done'}); }
function mergeInto(id, text){
  const p = MINE.find(x=>x.id===id); if (!p) return saveNew(text);
  text = ZipEngine.fixSTT(text);
  const a = ZipEngine.analyze(text);
  for (const [k,v] of Object.entries(a)) { if (k==='zone') continue; if (Array.isArray(v)) p[k] = [...new Set((p[k]||[]).concat(v))]; else if (v != null && (p[k] == null || !p.ai)) p[k] = v; }
  p.transcript = p.transcript ? p.transcript + '\n\n[추가 녹음] ' + text : text;
  p.visit = 'done'; p.updated = Date.now();
  if (!p.ai) { const r = ZipEngine.normalizeRegion(p.sido, p.sigungu, p.dong, p.transcript + ' ' + (p.custom_name||'')); p.zone = ZipEngine.classify(r, p.transcript); }
  saveMine(); reload(); return p;
}
function removeMine(id){ (MINE.find(p=>p.id===id)?.photos||[]).forEach(k=>PhotoDB.del(k)); MINE = MINE.filter(p=>p.id!==id); saveMine(); reload(); }

/* ═════════ 자금 계산 (imjang/finance.py 와 같은 규칙) ═════════ */
const SEED = {1:['1억 미만',0,10000],2:['1억~3억',10000,30000],3:['3억~5억',30000,50000],4:['5억~7억',50000,70000],5:['7억~10억',70000,100000],6:['10억 이상',100000,null]};
const BUYER = {'무주택':'무주택','생애최초':'생애최초','다주택':'2주택 이상'};
const INCOME = {0:['미입력',null],1:['3천만원 미만',2500],2:['3천~5천만원',3000],3:['5천~7천만원',5000],4:['7천만원~1억',7000],5:['1억 이상',10000]};
const LTV = {'true|무주택':.4,'false|무주택':.7,'true|생애최초':.7,'false|생애최초':.8};
const cap = p => p <= 150000 ? 60000 : p <= 250000 ? 40000 : 20000;
const dsrMax = inc => { const r=.045/12, n=360, m=inc*.4/12; return Math.floor(m*(1-Math.pow(1+r,-n))/r); };
function won(v){ if(v==null) return '확인 필요'; v=Math.round(v); const s=v<0?'-':''; v=Math.abs(v); const e=Math.floor(v/10000), m=v%10000; return s+(e&&m?`${e}억 ${m.toLocaleString()}만원`:e?`${e}억원`:`${m.toLocaleString()}만원`); }
const short = v => v==null ? null : v>=10000 ? (Math.round(v/1000)/10)+'억' : v.toLocaleString()+'만';
function loanEst(price, regulated, buyer, inc){
  if (buyer==='다주택') return {amount:0, basis:'2주택 이상: 수도권 주택구입 목적 주담대 불가'};
  const ltv = LTV[`${!!regulated}|${buyer}`], parts = [[Math.floor(price*ltv),`LTV ${ltv*100}%`],[cap(price),'절대 한도']];
  const income = INCOME[inc][1]; if (income) parts.push([dsrMax(income),'DSR 40%']);
  const [amt] = parts.reduce((a,b)=>b[0]<a[0]?b:a);
  return {amount:amt, basis: parts.map(p=>`${p[1]} ${won(p[0])}`).join(' · ')+` → ${won(amt)}`+(income?'':' (소득 미입력: DSR 미반영)')};
}
function judge(need, seed){
  const [,low,high] = SEED[seed], sh = need-low;
  if (sh <= 0) return {verdict:'가능', level:'ok'};
  const lv = sh <= 10000 ? 'warn' : 'bad';
  return {verdict:(lv==='warn'?'조금 부족 ':'많이 부족 ')+won(sh), level:lv, note:(high==null||need<=high)?'시드가 구간 상단에 가까우면 가능':''};
}
function finance(p){
  const z = p.zone || {zone:'?'}, price = p.sale_price, j = p.jeonse_price, out = [];
  if (price == null) return {scen:[{name:'판정 보류', na:'매매가가 필요해요', level:'na'}], tips:['녹음에서 가격을 말하거나, Claude 정리로 최근 실거래가를 찾으면 판정돼요']};
  const loan = loanEst(price, z.regulated, S.buyer, S.income);
  if (z.gap_allowed === true) { if (j == null) out.push({name:'갭투자', na:'전세가 확인 필요', level:'na'}); else { const need = price-j; out.push({name:'갭투자', need, ...judge(need,S.seed), detail:`매매 ${short(price)} − 전세 ${short(j)}`}); } }
  else if (z.gap_allowed === false) out.push({name:'갭투자', na:'불가 · 토허구역', level:'na', detail:'2년 실거주 의무'});
  const need = price - loan.amount;
  out.push({name:'실거주 매수', need, ...judge(need,S.seed), detail:`매매 ${short(price)} − 대출 추정 ${short(loan.amount)}`});
  const tips = [];
  if (S.buyer==='다주택') tips.push('다주택자는 수도권 주담대가 막혀 현금·전세 레버리지만 가능');
  else if (S.buyer==='생애최초') tips.push('생애최초 LTV 우대 — 디딤돌·보금자리론 해당 여부 은행 확인');
  else if (price <= 60000) tips.push('6억 이하 → 보금자리론 대상 가능성, 시중은행 금리와 비교');
  else tips.push('대출 한도 = LTV·절대 한도·DSR 중 가장 작은 값');
  if (z.zone==='A'||z.zone==='C') tips.push('토허구역: 허가 후 4개월 내 입주·2년 실거주 → 전세 끼고 매수 불가');
  if (p.seller_loan_exists && p.seller_loan_amount) tips.push(`매도인 융자 ${won(p.seller_loan_amount)} — 잔금 때 말소 조건 명시`);
  return {scen:out, basis:loan.basis, tips};
}
const best = f => f.scen.slice().sort((a,b)=>({ok:0,warn:1,bad:2,na:3}[a.level]-{ok:0,warn:1,bad:2,na:3}[b.level]))[0];

/* ═════════ 표시 도우미 ═════════ */
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SIDO_SHORT = {'서울특별시':'서울','경기도':'경기','인천광역시':'인천'};
const nameOf = p => p.custom_name || p.complex_name || `${p.dong || (p.sigungu||'').split(' ').pop() || '이름 없는'} ${p.property_type || '매물'}${p.area_pyeong ? ' '+p.area_pyeong+'평' : ''}`;
const gu = p => p.sigungu || '지역 미확인';
const spot = p => p.station_name || p.dong || '기타';
const zcls = z => z==='A'?'zA':z==='B'?'zB':z==='C'?'zC':'zq';
const subOf = p => p.households ? `${p.households.toLocaleString()}세대` : [SIDO_SHORT[p.sido], p.sigungu].filter(Boolean).join(' ') || (p.visit==='planned' ? '방문 전' : '정보 확인 필요');
const stChip = p => p.visit==='planned' ? '<span class="st plan">방문 예정</span>' : `<span class="st${p.sample?' smp':''}">${p.sample?'샘플':'임장 완료'}</span>`;
const MISS = [['sale_price','매매가'],['jeonse_price','전세가'],['area_pyeong','평형'],['built_year','연식'],['households','세대수'],['parking_per_household','주차'],['station_walk_min','역 거리']];
const missing = p => MISS.filter(([k])=>p[k]==null).map(([,l])=>l);
const I = {
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 6 6 6-6 6"/></svg>',
  pin:'<svg class="ic" style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  mic:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  back:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 5-7 7 7 7"/></svg>',
  search:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  bell:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  bookmark:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
  pen:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>',
  info:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="flex:none;margin-top:2px"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  play:'<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
};
const pcard = p => `<a class="pcard" href="#/p/${p.id}"><div class="t"><b>${esc(nameOf(p))}</b><span class="s">${esc(subOf(p))}</span></div>${stChip(p)}${I.chev}</a>`;

/* ═════════ 화면: 홈 ═════════ */
function home(){
  const rec = recent().map(id=>byId[id]).filter(Boolean).slice(0,2);
  const saved = P.filter(p=>!rec.includes(p)).slice(0,3);
  const planned = P.filter(p=>p.visit==='planned').length;
  return `
  <div class="top"><span class="logo">집노트</span>
    <div class="row" style="gap:0"><a class="iconbtn" href="#/records?q=" aria-label="검색">${I.search}</a>

  <button class="btn xl" data-act="rec"><span class="row" style="gap:12px">${I.mic}녹음 시작</span>${I.chev.replace('class="chev"','class="ic" style="color:#fff"')}</button>
  <div class="duo"><a class="btn line" href="#/region">${I.pin.replace('class="ic"','class="ic" style="color:var(--blue)"')} 지역별 매물 보기</a>
    <button class="btn line" data-act="plan">${I.plus} 방문 예정 추가</button></div>

  <section class="panel"><div class="panelhd"><h2>저장한 임장 기록</h2><a class="more" href="#/records">더보기 ›</a></div>
    ${saved.length ? saved.map(pcard).join('') : '<div class="empty">저장한 기록이 여기에 모여요.</div>'}</section>`;
}

/* ═════════ 화면: 지역별 매물 ═════════ */
function region(q){
  const head = `<div class="phd"><a class="iconbtn back" href="#/" aria-label="홈으로">${I.back}</a><h1>지역별 매물</h1><a class="iconbtn" href="#/records" aria-label="임장 기록">${I.bookmark}</a></div>`;
  const sidos = [...new Set(P.map(p=>p.sido).filter(Boolean))];
  if (!sidos.length) return head + `<div class="empty">지역이 확인된 매물이 아직 없어요.</div>`;
  const sido = sidos.includes(q.sido) ? q.sido : sidos[0];
  const gus = [...new Set(P.filter(p=>p.sido===sido).map(gu))];
  const g = gus.includes(q.gu) ? q.gu : gus[0];
  const inGu = P.filter(p=>p.sido===sido && gu(p)===g);
  const spots = ['전체', ...new Set(inGu.map(spot))];
  const sp = spots.includes(q.spot) ? q.spot : (spots.length > 2 ? '전체' : spots[1]);
  const base = sp==='전체' ? inGu : inGu.filter(p=>spot(p)===sp);
  const f = q.f || 'all';
  const list = f==='done' ? base.filter(p=>p.visit!=='planned') : f==='planned' ? base.filter(p=>p.visit==='planned') : base;
  const sel = (name, opts, cur, label) => `<span class="pill ${name==='spot'?'on':''}">${esc(label)} ▾<select aria-label="${name}" data-q="${name}">${opts.map(o=>`<option value="${esc(o)}" ${o===cur?'selected':''}>${esc(name==='sido'?SIDO_SHORT[o]||o:o)}</option>`).join('')}</select></span>`;
  const cnt = k => k==='done' ? base.filter(p=>p.visit!=='planned').length : k==='planned' ? base.filter(p=>p.visit==='planned').length : base.length;
  return head + `
  <div class="pills">${sel('sido',sidos,sido,SIDO_SHORT[sido]||sido)}<span class="sep">›</span>${sel('gu',gus,g,g)}<span class="sep">›</span>${sel('spot',spots,sp,sp)}</div>
  <div class="ftabs">${[['all','전체'],['done','임장 완료'],['planned','방문 예정']].map(([k,v])=>`<button class="ftab ${k===f?'on':''}" data-f="${k}">${v} (${cnt(k)})</button>`).join('')}</div>
  <div class="note">${I.info}<span>직접 임장한 매물과 방문 예정으로 저장한 매물만 표시돼요.</span></div>
  ${list.length ? list.map(pcard).join('') : '<div class="empty">이 조건의 매물이 없어요.</div>'}
  <button class="fab" data-act="rec" aria-label="녹음 시작">${I.mic}</button>`;
}

/* ═════════ 사진 · 지도 ═════════ */
const PhotoDB = {
  db: null,
  open(){ return this.db || (this.db = new Promise((res, rej) => { const r = indexedDB.open('zipnote', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })); },
  async put(k, b){ const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('photos','readwrite'); tx.objectStore('photos').put(b, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); },
  async get(k){ const db = await this.open(); return new Promise(res => { const q = db.transaction('photos').objectStore('photos').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); },
  async del(k){ try { const db = await this.open(); db.transaction('photos','readwrite').objectStore('photos').delete(k); } catch(_){} },
};
function shrink(file, max = 1280){
  return new Promise(res => { const img = new Image(); img.onload = () => { const s = Math.min(1, max/Math.max(img.width, img.height));
    const cv = Object.assign(document.createElement('canvas'), {width:Math.round(img.width*s), height:Math.round(img.height*s)});
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); cv.toBlob(b => { URL.revokeObjectURL(img.src); res(b || file); }, 'image/jpeg', .82); };
    img.onerror = () => res(file); img.src = URL.createObjectURL(file); });
}
async function addPhotos(id, files){
  const p = MINE.find(x=>x.id===id); if (!p || !files.length) return;
  p.photos = p.photos || [];
  for (const f of files) { const k = `${id}:${Date.now()}:${Math.random().toString(36).slice(2,6)}`; await PhotoDB.put(k, await shrink(f)); p.photos.push(k); }
  saveMine(); reload(); render(); toast(`사진 ${files.length}장을 붙였어요`);
}
const urlCache = {};
async function fillPhotos(){ for (const el of document.querySelectorAll('img[data-photo]')) { const k = el.dataset.photo; if (!urlCache[k]) { const b = await PhotoDB.get(k); if (!b) continue; urlCache[k] = URL.createObjectURL(b); } el.src = urlCache[k]; } }
async function locate(p){
  if (p.sample || p.geo !== undefined) return;
  const c = p.ai?.complex || {};
  const qs = [c.address, [c.sigungu, c.dong, c.name].filter(Boolean).join(' '), [p.sigungu, p.dong, nameOf(p)].filter(Boolean).join(' ')].filter(q => q && q.trim().length > 3);
  if (!qs.length) return;
  p.geo = null;
  for (const q of qs) { try { const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&accept-language=ko&q=${encodeURIComponent(q)}`); const j = await r.json(); if (j && j[0]) { p.geo = {lat:+j[0].lat, lon:+j[0].lon}; break; } } catch(_){} }
  saveMine(); rerenderIf(p.id);
}
const ILLUS = `<svg viewBox="0 0 400 150" preserveAspectRatio="xMidYMax slice"><rect width="400" height="150" fill="#E3EAF6"/>
  <g fill="#C7D3E8">${[30,90,250,320].map((x,i)=>`<rect x="${x}" y="${40+i%2*18}" width="46" height="${110-i%2*18}"/>`).join('')}</g>
  <g fill="#FFFFFF" stroke="#B7C4DC">${[60,140,200,290].map((x,i)=>`<rect x="${x}" y="${18+i*7}" width="56" height="${132-i*7}"/>`).join('')}</g>
  <g fill="#B7C4DC">${[60,140,200,290].flatMap((x,i)=>Array.from({length:7},(_,r)=>[0,1,2].map(c=>`<rect x="${x+8+c*16}" y="${30+i*7+r*15}" width="8" height="7"/>`).join(''))).join('')}</g>
  <path d="M0 150 Q60 120 120 137 T240 131 T400 129 V150Z" fill="#8DB07A"/></svg>`;
const coverIdx = {};   // 매물별로 지금 크게 보이는 사진 번호
function thumbsOf(p){
  const ph = p.photos || [];
  return `<div class="thumbs">${ph.map((k,i)=>`<button class="th ${i===(coverIdx[p.id]||0)?'on':''}" data-cover="${p.id}" data-i="${i}" aria-label="사진 ${i+1}"><img data-photo="${k}" alt=""></button>`).join('')}
    <label class="th add" aria-label="카메라로 찍기"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>찍기</span>
      <input type="file" accept="image/*" capture="environment" hidden data-addphoto="${p.id}"></label>
    <label class="th add" aria-label="앨범에서 여러 장 선택"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg><span>앨범</span>
      <input type="file" accept="image/*" multiple hidden data-addphoto="${p.id}"></label></div>`;
}
function viewer(id, i){
  const p = byId[id], ph = p?.photos || []; if (!ph.length) return;
  i = (i + ph.length) % ph.length;
  let el = document.getElementById('viewer');
  if (!el) { el = Object.assign(document.createElement('div'), {id:'viewer', className:'viewer'}); document.body.appendChild(el); }
  el.innerHTML = `<img data-photo="${ph[i]}" alt="임장 사진 ${i+1}">
    <div class="vbar"><button data-vclose>닫기</button><span>${i+1} / ${ph.length}</span><button data-vdel="${id}" data-i="${i}">삭제</button></div>
    ${ph.length>1?`<button class="vnav l" data-vgo="${id}" data-i="${i-1}" aria-label="이전">‹</button><button class="vnav r" data-vgo="${id}" data-i="${i+1}" aria-label="다음">›</button>`:''}`;
  el.classList.add('open'); fillPhotos();
}
function heroOf(p){
  const ph = p.photos || [];
  if (ph.length) { const i = Math.min(coverIdx[p.id] || 0, ph.length - 1);
    return `<button class="mainph" data-view="${p.id}" data-i="${i}" aria-label="사진 크게 보기"><img data-photo="${ph[i]}" alt="임장 사진 ${i+1}"></button><span class="lbl">사진 ${i+1} / ${ph.length} · 눌러서 크게</span>`; }
  if (p.geo) { const {lat, lon} = p.geo, d = .006; return `<div class="mapbox"><iframe title="단지 위치 지도" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${lon-d},${lat-d*.6},${lon+d},${lat+d*.6}&layer=mapnik&marker=${lat},${lon}"></iframe></div><span class="lbl">단지 위치 · © OpenStreetMap</span>`; }
  return `<div class="illus">${ILLUS}</div><span class="lbl">${p.sample ? '샘플 · 사진 없음' : '사진을 추가하거나 정리하면 지도가 떠요'}</span>`;
}

/* ═════════ 화면: 매물 상세 ═════════ */
function detail(id, q){
  const p = byId[id]; if (!p) return `<div class="empty">매물을 찾을 수 없어요.</div>`;
  const r = recent().filter(x=>x!==id); r.unshift(id); store.set('recent', r);
  setTimeout(() => { fillPhotos(); locate(p); }, 0);
  const a = p.ai, c = a?.complex || {}, m = a?.market || {}, v = a?.visit || {};
  const tab = q.tab || 'info';
  const crumbs = [SIDO_SHORT[p.sido], p.sigungu, p.station_name || p.dong].filter(Boolean);

  /* 녹음 정리 (기본 정보·현장 메모·한눈에 보기가 함께 쓴다) */
  const org = p.transcript ? ZipEngine.organize(ZipEngine.fixSTT(p.transcript), p.complex_name || p.custom_name) : null;
  const fx = p.transcript ? ZipEngine.facts(ZipEngine.fixSTT(p.transcript), org) : {};

  /* 기본 정보: 검색값(있으면) → 녹음에서 말한 내용 → 확인 필요 */
  const REC_B = '<span class="recb">녹음</span>';
  const row = (k, val, rec, optional) => (val==null||val==='') ? (optional ? '' : `<tr><th>${k}</th><td><span class="needtxt">확인 필요</span></td></tr>`)
    : `<tr><th>${k}</th><td>${esc(val)}${rec?REC_B:''}</td></tr>`;
  const hh = c.households ?? p.households, by = c.built_year ?? p.built_year, pk = c.parking_per_household ?? p.parking_per_household;
  const st = c.nearest_station, sw = c.station_walk_min;
  const pair = (searched, recorded) => searched != null && searched !== '' ? [searched, false] : [recorded, true];
  const [vSize, rSize] = pair(hh ? hh.toLocaleString()+'세대'+(hh>=1000?' · 대단지':hh<300?' · 소단지':'') : null, fx.size);
  const [vBuilt, rBuilt] = pair(by ? `${by}년 (${2026-by}년차)` : null, fx.built);
  const [vSt, rSt] = pair(a && (st||sw!=null) ? [st, sw!=null?'도보 '+sw+'분':null].filter(Boolean).join(' · ') : null, fx.station || (p.station_name ? [p.station_name, p.station_walk_min!=null?'도보 '+p.station_walk_min+'분':null].filter(Boolean).join(' · ') : null));
  const [vPk, rPk] = pair(a && pk!=null ? `세대당 ${pk}대 (${pk>=1?'1대 이상':'1대 미만'})` : null, fx.parking);
  const info = `<section class="card pane ${tab==='info'?'on':''}"><div class="cardhd">기본 정보 <span class="src">${a?'웹 검색 + 녹음':'녹음에서 정리'}</span></div>
    <table class="info">${row('단지명', c.name || nameOf(p))}${row('위치', c.address || [p.sido, p.sigungu, p.dong].filter(Boolean).join(' ') || null)}
      ${row('평형', p.area_pyeong ? p.area_pyeong+'평' : fx.area, !a || !p.area_pyeong)}${row('규모', vSize, rSize)}${row('준공', vBuilt, rBuilt)}
      ${row('역 · 교통', vSt, rSt)}${row('출퇴근', fx.commute, true, true)}${row('주차', vPk, rPk)}
      ${row('관리비', a ? null : fx.fee, true)}${row('관리 상태', fx.manage, true, true)}${row('내부', fx.inner, true, true)}
      ${row('학교', fx.school, true, true)}${row('생활 편의', fx.life, true, true)}${row('총평', fx.overall, true, true)}
      ${a?row('동·층', [c.buildings?c.buildings+'개 동':null, c.floors_max?'최고 '+c.floors_max+'층':null].filter(Boolean).join(' · ')||null, false, true)+row('시공사', c.builder, false, true):''}
      ${row('토허', p.zone?.label)}</table>
    ${a && (a.sources||[]).length ? `<details class="srcs"><summary>출처 ${a.sources.length}개</summary>${a.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a>`).join('')}</details>` : ''}</section>`;

  /* 현장 메모 */
  const li = arr => arr.map(x=>`<li>${esc(x)}</li>`).join('');
  const sec = (lab, arr) => arr && arr.length ? `<div class="lab">${lab}</div><ul>${li([...new Set(arr)])}</ul>` : '';
  const MOOD = {pos:['+','좋음'], neg:['−','아쉬움'], mix:['±','장단점'], neu:['·','']};
  let memoBody;
  if (a) memoBody = `${v.summary?`<p class="sum">${esc(v.summary)}</p>`:''}${sec('좋았던 점', v.pros)}${sec('아쉬운 점', v.cons)}${sec('하자 · 수리', v.defects)}${sec('관리 상태', v.management)}${sec('입지', v.location)}
    ${(v.to_check||[]).length?`<div class="lab">다시 확인할 것</div><div class="tags">${v.to_check.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`:''}`;
  else if (org && org.sections.length) memoBody = org.sections.map(s => `<div class="lab">${s.label}</div><ul class="olist">${s.items.map(i =>
      `<li class="${i.mood}"><span class="mi" aria-label="${MOOD[i.mood][1]}">${MOOD[i.mood][0]}</span><span>${esc(i.text)}</span></li>`).join('')}</ul>`).join('');
  else memoBody = `${sec('하자 · 수리', p.defects)}${sec('입지 · 관리', [p.commercial, p.middle_high, p.mgmt_office, p.elementary].filter(Boolean))}${sec('헷갈린 부분', p.uncertain)}`;
  if (p.memo) memoBody = `<div class="lab">내 메모</div><p class="sum" style="white-space:pre-wrap">${esc(p.memo)}</p>` + memoBody;
  if (!memoBody.trim()) memoBody = `<div class="empty" style="padding:10px">${p.visit==='planned'?'방문 후 녹음하거나 메모를 남겨 주세요.':'정리된 메모가 없어요.'}</div>`;
  const memo = `<section class="card pane memo ${tab==='memo'?'on':''}"><div class="cardhd">현장 메모 ${p.sample?'':`<button class="edit-btn" data-act="memo" data-id="${p.id}">${I.pen} 편집</button>`}</div>${memoBody}</section>`;

  /* 자금 비교 */
  const f = finance(p);
  const srcNote = p.sale_src==='녹음' ? '녹음에서 들은 가격' : p.sale_src==='실거래' ? `최근 실거래가${m.sale_date?' ('+esc(m.sale_date)+')':''}` : p.sample ? '녹음에서 들은 가격' : '';
  const fund = `<section class="card pane ${tab==='fund'?'on':''}"><div class="cardhd">자금 비교 <span class="src">참고용 추정</span></div>
    <div class="pricegrid"><span>매매가</span><div class="pricebox"><b>${short(p.sale_price)||'—'}</b>${srcNote?`<small>${srcNote}</small>`:''}</div>
      <span>전세가</span><div class="pricebox"><b>${short(p.jeonse_price)||'—'}</b>${p.jeonse_src?`<small>${p.jeonse_src==='녹음'?'녹음에서 들은 가격':'최근 실거래가'}</small>`:''}</div></div>
    <div class="need-box">${f.scen.map(s=>`<div class="scen"><div><div class="nm">${s.name}${s.need!=null?' · 필요 자금':''}</div>
        ${s.need!=null?`<div class="v">약 ${short(s.need)}</div>`:`<div class="na">${s.na}</div>`}${s.detail?`<div class="d">${esc(s.detail)}</div>`:''}</div>
        ${s.need!=null?`<span class="pillv ${s.level}">${s.verdict}</span>`:''}</div>`).join('')}</div>
    <button class="cond" data-act="settings"><span>내 조건 <b>시드 ${SEED[S.seed][0]}</b> · ${BUYER[S.buyer]}</span><span style="color:var(--blue);font-weight:800">변경</span></button>
    ${f.tips?`<ul class="ul-sm">${f.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}
    <p class="fine">${f.basis?'대출 추정: '+esc(f.basis)+'<br>':''}${esc(p.zone?.reason||'')}<br>세금 미반영 · 대출은 은행 상담 필수 · ${esc(p.zone?.caution||'')}</p></section>`;

  /* 한눈에 보기 (녹음 정리 요약) */
  const tags = a ? [] : (org ? org.tags : []);
  const todos = (a ? (v.to_check||[]) : (org ? org.todos : [])).concat(missing(p).filter(x=>['매매가','전세가'].includes(x)).map(x=>`${x} 확인`));
  const cnt = org ? org.counts : null;
  const summary = (p.visit==='planned' && !p.transcript) ? '' : `<section class="card glance"><div class="cardhd">한눈에 보기 ${cnt&&!a?`<span class="src"><b class="mk pos">+</b> 좋음 ${cnt.pos} &nbsp;<b class="mk mix">±</b> 장단점 ${cnt.mix} &nbsp;<b class="mk neg">−</b> 아쉬움 ${cnt.neg}</span>`:''}</div>
    ${a && v.summary ? `<p class="sum" style="margin:0">${esc(v.summary)}</p>` : ''}
    ${tags.length?`<div class="htags">${tags.map(t=>t[0]==='!'?`<span class="htag warn">${esc(t.slice(1))}</span>`:`<span class="htag">${esc(t)}</span>`).join('')}</div>`:''}
    ${!a && !tags.length ? '<p class="small muted" style="margin:0">녹음에서 뽑을 핵심 키워드가 없었어요. 단지 이름·역·평형·좋았던 점을 말해 보세요.</p>' : ''}
    ${todos.length?`<div class="lab2" style="margin-top:12px">할 일 · 확인할 것</div><ul class="todo">${[...new Set(todos)].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${p.status==='analyzing'?`<div class="row small" style="margin-top:10px;color:var(--blue)"><div class="spinner" style="width:18px;height:18px;border-width:3px;margin:0"></div>${esc(p.step||'자동 정리 중')}</div>`:''}
    ${p.status==='error'?`<p class="small" style="color:var(--bad);margin:10px 0 0">자동 정리 실패: ${esc(p.error)}</p>`:''}</section>`;
  const aiCard = '';

/* 녹음 (폰 음성인식) */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const REC = {sr:null, on:false, prev:'', final:'', start:0, timer:null, target:''};
let wakeLock = null;
async function keepAwake(on){ try { if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch(_){} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && REC.on) { keepAwake(true); try { REC.sr && REC.sr.start(); } catch(_){} } });
const saveDraft = () => store.set('draft', {text:REC.final, target:REC.target, t:Date.now()});
function recSheet(target){

  ${SR ? `<div class="recmain"><button class="bigmic" id="bigmic" data-act="mic" aria-label="녹음 시작">${I.mic}</button><span class="rectime" id="rectime">눌러서 녹음 시작</span></div>

  <div id="after" ${SR && !useDraft ? 'hidden' : ''}>

  </div>

    ${SAMPLES.map(p=>`<div class="sample"><button class="play" data-play="${p.id}" aria-label="재생">${I.play}</button><div class="s"><b>${esc(nameOf(p))}</b><small>AI 음성 샘플</small></div><a class="link" href="#/p/${p.id}" style="font-size:13px">정리 결과 ›</a></div>`).join('')}

const fmtTime = ms => { const s = Math.floor(ms/1000); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; };
function startRec(){
  const ed = document.getElementById('edit');
  REC.prev = ed && ed.value.trim() ? ed.value.trim()+' ' : ''; REC.final = REC.prev;
  const sr = new SR(); REC.sr = sr; REC.on = true; REC.start = Date.now();
  sr.lang = 'ko-KR'; sr.continuous = true; sr.interimResults = true;
  sr.onresult = e => {
    let fin = '', interim = '';
    for (let i = 0; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) fin += r[0].transcript+' '; else interim += r[0].transcript; }
    REC.final = (REC.prev + fin).replace(/\s+/g,' '); saveDraft();
    const live = document.getElementById('live'); if (live) { live.innerHTML = esc(REC.final)+`<span class="interim">${esc(interim)}</span>`; live.scrollTop = live.scrollHeight; }
  };
  sr.onerror = e => {
    if (e.error==='not-allowed'||e.error==='service-not-allowed') { toast('마이크 권한을 허용해 주세요 (주소창 🔒 → 마이크)'); finishRec(); }
    else if (e.error==='audio-capture') { toast('마이크를 찾을 수 없어요'); finishRec(); }
    else if (e.error==='network') { toast('음성인식은 인터넷 연결이 필요해요'); finishRec(); }
  };
  sr.onend = () => { if (REC.on) { REC.prev = REC.final+' '; try { sr.start(); } catch(_){} } };
  try { sr.start(); } catch(e) { toast('녹음을 시작할 수 없어요'); REC.on = false; return; }
  keepAwake(true);
  const b = document.getElementById('bigmic'); b.classList.add('on'); b.setAttribute('aria-label','녹음 끝내기');
  b.innerHTML = '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>';
  document.getElementById('after').hidden = true;
  REC.timer = setInterval(() => { const el = document.getElementById('rectime'); if (el) el.innerHTML = `<span class="recdot"></span>듣는 중 ${fmtTime(Date.now()-REC.start)}${wakeLock?' · 화면 켜짐 유지':''} · 다 말했으면 ■`; }, 300);
}
function abortRec(){ REC.on = false; clearInterval(REC.timer); keepAwake(false); if (REC.sr) { try { REC.sr.abort(); } catch(_){} REC.sr = null; } }
function finishRec(){
  const wasOn = REC.on; abortRec();
  const b = document.getElementById('bigmic'); if (!b) return;
  b.classList.remove('on'); b.innerHTML = I.mic; b.setAttribute('aria-label','이어서 녹음');
  document.getElementById('rectime').textContent = wasOn ? `녹음 ${fmtTime(Date.now()-REC.start)} · 다시 누르면 이어서 녹음` : '눌러서 녹음 시작';
  const ed = document.getElementById('edit'); ed.value = REC.final.trim(); document.getElementById('after').hidden = false;
  if (!ed.value) ed.placeholder = '들린 말이 없어요. 다시 녹음하거나 직접 적어 주세요.';
}
function saveRec(){
  const text = (document.getElementById('edit').value || '').trim();
  if (text.length < 4) { toast('정리할 내용이 없어요'); return; }
  const p = REC.target ? mergeInto(REC.target, text) : saveNew(text);
  store.set('draft', null); closeSheet(); go('#/p/'+p.id); runAI(p.id);
}
let audioEl = null, audioBtn = null;
function stopAudio(){ if (audioEl) { audioEl.pause(); audioEl = null; } if (audioBtn) { audioBtn.innerHTML = I.play; audioBtn = null; } }
function togglePlay(btn){ const same = audioBtn === btn; stopAudio(); if (same) return; audioEl = new Audio(byId[btn.dataset.play].audio); audioBtn = btn; btn.innerHTML = I.pause; audioEl.onended = stopAudio; audioEl.play().catch(() => { toast('음성 파일을 열 수 없어요'); stopAudio(); }); }
function backup(){ const url = URL.createObjectURL(new Blob([JSON.stringify(MINE, null, 1)], {type:'application/json'})); const a = Object.assign(document.createElement('a'), {href:url, download:`zipnote_backup_${new Date().toISOString().slice(0,10)}.json`}); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000); }

/* ═════════ AI 정리 ═════════ */
const RUNNING = new Set();
function rerenderIf(id){ const {parts} = parse(); if (parts[0]==='p' && parts[1]===id) render(true); }
async function runAI(id){
  const p = MINE.find(x=>x.id===id); if (!p || RUNNING.has(id)) return;
  const key = store.get('apikey','');
  if (!key) { p.status = 'local'; saveMine(); rerenderIf(id); return; }   // 키 없으면 폰 안 정리만 (이미 끝남)
  RUNNING.add(id); p.status = 'analyzing'; p.step = '단지를 찾고 있어요'; p.error = null; saveMine(); rerenderIf(id);
  try { const r = await ZipAI.analyze(key, p.transcript || `단지명: ${nameOf(p)} (방문 전, 단지 정보만 찾기)`, s => { p.step = s; saveMine(); rerenderIf(id); }); applyReport(p, r); p.status = 'done'; toast('정리 완료'); }
  catch(e) { p.status = 'error'; p.error = ZipAI.friendlyError(e); }
  finally { RUNNING.delete(id); saveMine(); reload(); rerenderIf(id); }
}
function applyReport(p, r){
  const c = r.complex || {}, m = r.market || {}, v = r.visit || {};
  p.ai = r; p.geo = undefined; p.updated = Date.now();
  if (c.name) p.complex_name = c.name;
  p.sido = c.sido || p.sido; p.sigungu = c.sigungu || p.sigungu; p.dong = c.dong || p.dong;
  p.property_type = p.property_type || '아파트';
  p.area_pyeong = v.said_area_pyeong ?? m.area_pyeong ?? p.area_pyeong;
  p.sale_price = v.said_sale ?? m.sale_recent ?? null; p.sale_src = v.said_sale != null ? '녹음' : m.sale_recent != null ? '실거래' : null;
  p.jeonse_price = v.said_jeonse ?? m.jeonse_recent ?? null; p.jeonse_src = v.said_jeonse != null ? '녹음' : m.jeonse_recent != null ? '실거래' : null;
  for (const [k, ck] of [['households','households'],['built_year','built_year'],['parking_per_household','parking_per_household'],['station_name','nearest_station'],['station_walk_min','station_walk_min']]) p[k] = c[ck] ?? p[k] ?? null;
  p.defects = v.defects || [];
  const reg = ZipEngine.normalizeRegion(p.sido, p.sigungu, p.dong, [c.address, p.transcript].filter(Boolean).join(' '));
  p.sido = reg.sido || p.sido; p.zone = ZipEngine.classify(reg, [c.address, p.dong].filter(Boolean).join(' '));
}

/* ═════════ 라우터 · 이벤트 ═════════ */
function parse(){ const [path, qs] = (location.hash.slice(1)||'/').split('?'); return {parts:path.split('/').filter(Boolean), q:Object.fromEntries(new URLSearchParams(qs||''))}; }
let keepScroll = false;
function render(stay){
  const {parts, q} = parse(), v = document.getElementById('view'), pg = parts[0];
  const y = scrollY;
  v.innerHTML = pg==='region' ? region(q) : pg==='records' ? records(q) : pg==='me' ? me() : pg==='p' ? detail(parts[1], q) : home();
  const t = pg==='region'||pg==='p' ? 'region' : pg==='records' ? 'records' : pg==='me' ? 'me' : 'home';
  document.querySelectorAll('[data-t]').forEach(a => a.classList.toggle('on', a.dataset.t === t));
  if (pg==='p' && q.print) setTimeout(() => printPage(parts[1], q.print === 'preview'), 300);   // 링크로 바로 인쇄용 화면
  if (q.ai) { const c = document.getElementById('aicard'); c && c.scrollIntoView({block:'center'}); }
  else if (stay || keepScroll) scrollTo(0, y); else scrollTo(0, 0);
  keepScroll = false;
  const qi = document.getElementById('q'); if (qi && q.q !== undefined && document.activeElement !== qi && !q.q) qi.focus();
}
/* 사진 크게 보기 · 대표 사진 */

}, true);

/* 한 페이지로 저장 (인쇄 → PDF) */
async function printPage(id, noDialog){
  const p = byId[id], v = document.getElementById('view'); if (!p) return;
  let pp = document.getElementById('printpage');
  if (!pp) { pp = Object.assign(document.createElement('div'), {id:'printpage'}); document.body.appendChild(pp); }
  const panes = [...v.querySelectorAll('.cols .pane')].map(x => x.outerHTML);
  const photos = (p.photos || []).slice(0, 4).map(k => `<img data-photo="${k}" alt="">`).join('');
  const addr = [p.ai?.complex?.address || [p.sido, p.sigungu, p.dong].filter(Boolean).join(' '), p.zone?.label].filter(Boolean).join(' · ');
  pp.innerHTML = `<header><div><div class="pl">집노트 · 임장 기록</div><h1>${esc(nameOf(p))}</h1><div class="pa">${esc(addr)}</div></div>
      <div class="pd">${new Date(p.updated || p.created || Date.now()).toLocaleDateString('ko-KR')}<br>시드 ${SEED[S.seed][0]} · ${BUYER[S.buyer]}</div></header>
    ${photos ? `<div class="pphotos n${Math.min((p.photos||[]).length,4)}">${photos}</div>` : ''}
    ${v.querySelector('.glance')?.outerHTML || ''}<div class="pcols">${panes.join('')}</div>
    <footer>모든 수치는 녹음·검색 기반 참고용 추정입니다. 세금 미반영, 대출은 은행 상담 필수. 토허구역은 거래 전 직접 조회하세요.</footer>`;
  pp.className = 'capture';
  await fillPhotos();
  await Promise.all([...pp.querySelectorAll('img')].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  if (noDialog) return;
  // 인쇄 기능은 카카오톡 안 브라우저 등에서 막혀 있어서, 앱이 직접 이미지·PDF 파일을 만든다
  toast('한 페이지로 만드는 중…');
  try {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const canvas = await window.html2canvas(pp, {scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false});
    const jpg = canvas.toDataURL('image/jpeg', .92);
    const pdf = new window.jspdf.jsPDF({unit: 'mm', format: 'a4'});
    const w = 210, h = canvas.height * w / canvas.width, fit = Math.min(1, 297 / h);   // 길면 한 장에 맞게 줄인다
    pdf.addImage(jpg, 'JPEG', (210 - w * fit) / 2, 0, w * fit, h * fit);
    const name = `집노트_${nameOf(p).replace(/[\\/:*?"<>|]/g, '')}`;
    SHOT = {name, pdf: pdf.output('blob'), img: await new Promise(r => canvas.toBlob(r, 'image/jpeg', .92))};
    if (SHOT.url) URL.revokeObjectURL(SHOT.url);
    SHOT.url = URL.createObjectURL(SHOT.img);
    openSheet(`<h3>한 페이지로 저장</h3>
      <img class="shotprev" src="${SHOT.url}" alt="한 페이지 미리보기">
      <div class="duo" style="margin-top:12px"><button class="btn sm" data-act="shot-share">공유하기</button><button class="btn line sm" data-act="shot-pdf">PDF 저장</button></div>
      <button class="btn line sm" data-act="shot-img" style="margin-top:8px">이미지로 저장</button>
      <p class="fine">저장이 안 되면 위 미리보기를 <b>길게 눌러 이미지 저장</b>하세요. 카카오톡 안에서 열었다면 오른쪽 위 메뉴 → <b>다른 브라우저로 열기</b>를 하면 PDF 저장이 잘 돼요.</p>`);
  } catch (err) {
    toast('파일을 만들지 못했어요. 인터넷 연결을 확인해 주세요.');
  } finally { pp.className = ''; }
}
let SHOT = null;
function loadScript(src){ return new Promise((res, rej) => { if ([...document.scripts].some(s => s.src === src)) return res(); const s = Object.assign(document.createElement('script'), {src, onload: res, onerror: rej}); document.head.appendChild(s); }); }
function saveBlob(blob, filename){ const url = URL.createObjectURL(blob); const a = Object.assign(document.createElement('a'), {href: url, download: filename}); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); }
async function shareShot(){
  const files = [new File([SHOT.pdf], SHOT.name + '.pdf', {type: 'application/pdf'})];
  if (navigator.canShare && navigator.canShare({files})) { try { await navigator.share({files, title: SHOT.name}); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const imgFile = [new File([SHOT.img], SHOT.name + '.jpg', {type: 'image/jpeg'})];
  if (navigator.canShare && navigator.canShare({files: imgFile})) { try { await navigator.share({files: imgFile, title: SHOT.name}); return; } catch (e) { if (e.name === 'AbortError') return; } }
  saveBlob(SHOT.pdf, SHOT.name + '.pdf'); toast('이 브라우저는 공유를 지원하지 않아 PDF로 내려받았어요');
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-f],[data-set],[data-play],[data-del],[data-rename],[data-delphoto],[data-tab]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (act==='print') { printPage(id); return; }
  if (act==='back') { goBack(); return; }
  if (act==='shot-share') { shareShot(); return; }
  if (act==='shot-pdf') { saveBlob(SHOT.pdf, SHOT.name + '.pdf'); toast('PDF를 저장했어요'); return; }
  if (act==='shot-img') { saveBlob(SHOT.img, SHOT.name + '.jpg'); toast('이미지를 저장했어요'); return; }
  if (t.dataset.tab) { setQ({tab:t.dataset.tab}, true); return; }
  if (t.dataset.delphoto) { const p = MINE.find(x=>x.id===id); if (p && confirm('이 사진을 지울까요?')) { p.photos = (p.photos||[]).filter(k=>k!==t.dataset.delphoto); PhotoDB.del(t.dataset.delphoto); saveMine(); render(true); } return; }
  if (t.dataset.rename) { const p = MINE.find(x=>x.id===t.dataset.rename); if (!p) return; const nv = prompt('매물 이름', nameOf(p)); if (nv != null) { p.custom_name = nv.trim() || null; saveMine(); reload(); render(true); toast('이름을 바꿨어요'); } return; }
  if (t.dataset.del) { if (confirm('이 매물을 삭제할까요? 이 폰에서 지워지고 되돌릴 수 없어요.')) { removeMine(t.dataset.del); NAV.length = 0; go('#/', {replace:true}); toast('삭제했어요'); } return; }
  if (t.dataset.f) { setQ({f:t.dataset.f}, true); return; }
  if (t.dataset.play) { togglePlay(t); return; }
  if (t.dataset.set) { const k = t.dataset.set; S[k] = k==='buyer' ? t.dataset.v : k==='samples' ? t.dataset.v==='1' : +t.dataset.v; store.set('settings', S); reload();
    if (sheet.classList.contains('open')) settingsSheet(); render(true); toast('조건을 바꿨어요 · 판정을 다시 계산했어요'); return; }
  if (act==='rec') recSheet(t.dataset.target);
  else if (act==='plan') planSheet();
  else if (act==='plan-save') { const name = document.getElementById('pname').value.trim(); if (!name) { toast('단지명을 적어 주세요'); return; }
    const area = document.getElementById('parea').value.trim(), memo = document.getElementById('pmemo').value.trim();
    const r = ZipEngine.normalizeRegion(null, null, null, `${area} ${name}`);
    const p = newProp({custom_name:name, visit:'planned', memo:memo||null, sido:r.sido, sigungu:[r.city, r.gu].filter(Boolean).join(' ')||null, dong:(area.match(/[가-힣]+동/)||[])[0]||null, zone:ZipEngine.classify(r, `${area} ${name}`)});
    closeSheet(); go('#/p/'+p.id); toast('방문 예정으로 저장했어요'); }
  else if (act==='memo') memoSheet(id);
  else if (act==='memo-save') { const p = MINE.find(x=>x.id===id); if (p) { p.memo = document.getElementById('memoedit').value.trim() || null; p.updated = Date.now(); saveMine(); reload(); } closeSheet(); render(true); toast('메모를 저장했어요'); }
  else if (act==='settings') settingsSheet();
  else if (act==='close') closeSheet();
  else if (act==='mic') REC.on ? finishRec() : startRec();
  else if (act==='redo') { document.getElementById('edit').value = ''; REC.prev = REC.final = ''; const l = document.getElementById('live'); if (l) l.innerHTML = ''; if (SR) startRec(); }
  else if (act==='save') saveRec();
  else if (act==='backup') backup();
  else if (act==='reai') runAI(id);
  else if (act==='handoff') { const p = MINE.find(x=>x.id===id); if (!p) return;
    const prompt = ZipAI.handoffPrompt(p.transcript || `단지명: ${nameOf(p)}${p.sigungu?' ('+p.sigungu+')':''} — 아직 방문 전. 단지 정보와 최근 시세만 찾아 주세요.`), enc = encodeURIComponent(prompt);
    const base = t.dataset.to==='claude' ? 'https://claude.ai/new' : 'https://chatgpt.com/';
    (navigator.clipboard ? navigator.clipboard.writeText(prompt) : Promise.reject()).then(() => toast('질문을 복사했어요 · 열리는 앱에 붙여넣기 하세요'), () => toast('복사가 안 되면 녹음 원문을 직접 복사해 주세요'));
    window.open(enc.length < 12000 ? `${base}?q=${enc}` : base, '_blank', 'noopener'); }
  else if (act==='apply-paste') { const p = MINE.find(x=>x.id===id), txt = (document.getElementById('paste').value||'').trim();
    if (!p || !txt) { toast('답을 먼저 붙여넣어 주세요'); return; }
    try { applyReport(p, ZipAI.parseHandoff(txt)); p.status = 'done'; p.error = null; saveMine(); reload(); render(); toast('정리 완료'); } catch(err) { toast(err.message); } }
  else if (act==='aikey-save') { const nv = document.getElementById('apikey').value.trim(); store.set('apikey', nv); toast(nv ? '키를 저장했어요' : '키를 지웠어요'); }
  else if (act==='aikey-test') { const nv = document.getElementById('apikey').value.trim(); if (!nv) { toast('키를 먼저 넣어 주세요'); return; }
    t.textContent = '확인 중…'; ZipAI.testKey(nv).then(() => { toast('연결됐어요 ✓'); store.set('apikey', nv); }).catch(err => toast(ZipAI.friendlyError(err))).finally(() => { t.textContent = '연결 확인'; }); }
});
document.addEventListener('change', e => {
  const up = e.target.closest('input[data-addphoto]'); if (up) { addPhotos(up.dataset.addphoto, [...up.files]).catch(() => toast('사진을 저장하지 못했어요')); return; }
  const s = e.target.closest('select[data-q]'); if (!s) return;
  setQ(s.dataset.q==='sido' ? {sido:s.value, gu:null, spot:null} : s.dataset.q==='gu' ? {gu:s.value, spot:null} : {spot:s.value}, true);
});
let st_; document.addEventListener('input', e => { if (e.target.id === 'q') { clearTimeout(st_); const v = e.target.value; st_ = setTimeout(() => { setQ({q:v}, true); setTimeout(() => { const qi = document.getElementById('q'); if (qi) { qi.focus(); qi.setSelectionRange(v.length, v.length); } }, 0); }, 300); } });
/* ═════════ 화면 이동 · 뒤로 버튼: 앱이 직접 관리 ═════════
   브라우저 기록은 [시작, 현재] 두 칸만 쓰고, 앱 안의 이동은 NAV 목록으로 기억한다.
   → 폰의 뒤로 버튼: 시트·사진 닫기 → 이전 화면 → 홈 → "한 번 더 누르면 닫혀요" → 종료 */
const NAV = [];
let CUR = location.hash || '#/', lastBack = 0;
const viewerOpen = () => document.getElementById('viewer')?.classList.contains('open');
function ensureGuard(){ if (!(history.state && history.state.zguard)) history.pushState({zguard:1}, '', CUR); }
function go(hash, opt = {}){
  hash = hash || '#/';
  if (!opt.replace && hash !== CUR) NAV.push(CUR);
  if (NAV.length > 50) NAV.shift();
  CUR = hash; keepScroll = !!opt.keep;
  ensureGuard(); history.replaceState({zguard:1}, '', hash);
  closeSheet(); document.getElementById('viewer')?.classList.remove('open');
  render();
}
function goBack(){ if (NAV.length) { CUR = NAV.pop(); } else CUR = '#/'; ensureGuard(); history.replaceState({zguard:1}, '', CUR); closeSheet(); render(); }
function setQ(patch, keep){ const {parts, q} = parse(); const n = {...q, ...patch}; Object.keys(n).forEach(k => n[k]==null && delete n[k]); go('#/'+parts.join('/')+'?'+new URLSearchParams(n), {replace:true, keep}); }
// 앱 안 링크는 기록을 쌓지 않고 go()로 이동
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]'); if (!a || a.target === '_blank') return;
  e.preventDefault(); go(a.getAttribute('href'));
}, true);
document.addEventListener('pointerdown', ensureGuard, {once:true, capture:true});   // 일부 브라우저는 터치 후에 깐 기록만 인정
const isHome = h => !(h || '').replace(/^#\/?/, '').split('?')[0];
window.addEventListener('popstate', e => {
  if (e.state && e.state.zguard) return;
  let rerender = false;
  if (sheet.classList.contains('open')) closeSheet();
  else if (viewerOpen()) document.getElementById('viewer').classList.remove('open');
  else if (NAV.length) { CUR = NAV.pop(); rerender = true; }
  else if (!isHome(CUR)) { CUR = '#/'; rerender = true; }
  else if (Date.now() - lastBack < 2000) { history.back(); return; }          // 두 번째 → 종료
  else { lastBack = Date.now(); toast('한 번 더 누르면 앱이 닫혀요'); }
  history.pushState({zguard:1}, '', CUR);                                      // 경고용 칸을 다시 깐다
  if (rerender) render();
});
window.addEventListener('hashchange', () => { CUR = location.hash || '#/'; closeSheet(); document.getElementById('viewer')?.classList.remove('open'); render(); });
history.replaceState({zbase:1}, '', location.href); history.pushState({zguard:1}, '', CUR);
render();
</script>
