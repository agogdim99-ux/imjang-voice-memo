<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF8F3">
<title>집노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#FBF8F3; --surface:#FFFFFF; --card:#F6F0E8; --line:#E9E0D4; --line2:#F0E9DF;
  --ink:#3A2618; --ink2:#5E4634; --muted:#8C7A6B;
  --blue:#1338B3; --blue-ink:#0D2A8A; --blue-soft:#E9EEFB;
  --ok:#1F7A45; --ok-bg:#E7F4EC; --warn:#9A6200; --warn-bg:#FBF1DC; --bad:#B4232C; --bad-bg:#FBE8E8; --na:#7A6E66; --na-bg:#EFEAE4;
  --need:#A6620F; --need-bg:#FFF4E2;
  --radius:16px; --shadow:0 1px 2px rgba(58,38,24,.05),0 6px 24px rgba(58,38,24,.06);
  --display:"Gowun Batang",serif; --sans:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#EFE8DE;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.phone{position:relative;max-width:430px;min-height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column}
@media (min-width:600px){.phone{margin:24px auto;min-height:calc(100dvh - 48px);border-radius:36px;box-shadow:0 20px 60px rgba(58,38,24,.18);overflow:hidden}}
main{flex:1;overflow-y:auto;padding:12px 20px 110px}
.disp{font-family:var(--display);font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.ic{width:22px;height:22px;flex:none}
.muted{color:var(--muted)} .small{font-size:12.5px}

/* 상단 */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.brand{font-size:26px}
.iconbtn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:12px}
.iconbtn:active{background:var(--card)}
.badge{position:absolute;top:4px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--blue);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.hero{font-size:30px;line-height:1.3;margin:18px 0 22px}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:17px;box-shadow:0 6px 16px rgba(19,56,179,.25)}
.btn:active{background:var(--blue-ink);transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--blue);box-shadow:none;border:1.5px solid var(--blue)}

h2.sec{font-size:17px;font-weight:700;margin:30px 0 8px;color:var(--ink)}
.list{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:10px;padding:14px 6px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:active{background:var(--card)}
.li .name{flex:1;font-size:16px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .meta{color:var(--ink2);font-size:14px;font-variant-numeric:tabular-nums}
.chev{width:18px;height:18px;color:var(--ink2);flex:none}
.zdot{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;flex:none}
.zA,.zC{background:var(--bad-bg);color:var(--bad)} .zB{background:var(--ok-bg);color:var(--ok)} .zq{background:var(--na-bg);color:var(--na)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{height:42px;font-weight:500;color:var(--ink2);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--blue);color:#fff;font-weight:700}
.grouphd{display:flex;align-items:center;gap:8px;padding:14px 6px 10px;color:var(--ink2);font-weight:500;width:100%}
.grouphd .arrow{color:var(--muted)}
.grouphd .tog{margin-left:auto;transition:transform .2s}
.grouphd[aria-expanded=false] .tog{transform:rotate(-90deg)}
.indent .li{padding-left:16px}
.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:14px}

/* 하단 탭 */
nav.tabs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
@media (max-width:599px){nav.tabs{position:fixed;max-width:430px;margin:0 auto}}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;font-size:12.5px;color:var(--ink2);border-top:3px solid transparent}
nav.tabs a.on{color:var(--blue);font-weight:700;border-top-color:var(--blue)}

/* 지역별 */
.pagehd{font-size:28px;margin:18px 0 14px}
.crumb{display:flex;align-items:center;gap:6px;margin:0 -20px;padding:12px 20px;background:var(--card);font-weight:500}
.crumb select{appearance:none;border:0;background:transparent;font:inherit;font-weight:600;color:var(--ink);padding:2px 18px 2px 2px;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:right 6px center,right 1px center;background-size:5px 5px;background-repeat:no-repeat}
.subtabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:10px;scrollbar-width:none}
.subtabs button{padding:12px 14px;white-space:nowrap;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px}
.subtabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.chips{display:flex;gap:8px;margin:12px 0 6px;overflow-x:auto;scrollbar-width:none}
.chip{height:36px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.note{display:flex;gap:6px;align-items:flex-start;margin-top:12px;color:var(--muted);font-size:12.5px}
.fab{position:absolute;right:20px;bottom:92px;width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(19,56,179,.35)}
@media (max-width:599px){.fab{position:fixed;right:max(20px,calc(50vw - 195px))}}

/* 상세 */
.dethd{display:flex;align-items:center;gap:6px;margin:0 -20px;padding:10px 12px;position:sticky;top:-12px;background:var(--bg);z-index:5}
.dethd .t{flex:1;text-align:center;font-weight:700;font-size:16.5px;margin-right:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo{position:relative;margin:0 -20px;height:170px;background:linear-gradient(180deg,#DCE5F5 0%,#EEF1F7 55%,#E7E0D3 100%);display:grid;place-items:end center;overflow:hidden}
.photo svg{width:100%;height:150px}
.photo .lbl{position:absolute;right:12px;bottom:10px;font-size:11.5px;color:#fff;background:rgba(58,38,24,.55);padding:3px 8px;border-radius:6px}
.dtitle{font-size:26px;margin:18px 0 4px;line-height:1.3}
.loc{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:14.5px}
.card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-top:14px}
.cardhd{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16.5px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.cardhd .more{margin-left:auto;font-size:13px;font-weight:500;color:var(--blue)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);padding-top:10px}
.stat{padding:0 8px;border-left:1px solid var(--line)} .stat:first-child{border-left:0;padding-left:0}
.stat .k{font-size:12px;color:var(--ink2)} .stat .v{font-size:clamp(16px,5vw,20px);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v.need{font-size:13px;font-weight:700;color:var(--need)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:7px 8px;padding-top:12px;font-size:14px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;font-weight:500}
.needtxt{color:var(--need);font-weight:600}
.bul{margin:10px 0 0;padding-left:18px} .bul li{margin:4px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--need-bg);color:var(--need);font-weight:600}
.sublbl{font-size:12.5px;font-weight:700;color:var(--ink2);margin-top:12px}
.scen{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.scen:last-of-type{border-bottom:0}
.scen .nm{font-size:13px;color:var(--ink2)} .scen .need{font-size:26px;font-weight:800;letter-spacing:-.02em}
.scen .na{font-size:15px;font-weight:700;color:var(--na)}
.pill{font-size:13px;font-weight:700;padding:6px 11px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.na{background:var(--na-bg);color:var(--na)}
.cond{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding:10px 12px;background:var(--surface);border-radius:10px;font-size:13.5px}
.cond b{color:var(--ink)}
.fine{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.55}
details.raw{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px 16px}
details.raw summary{padding:12px 0;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.raw summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);transition:transform .2s}
details.raw[open] summary::after{transform:rotate(-135deg)}
details.raw p{font-size:14px;color:var(--ink2);margin:0 0 12px}
audio{width:100%;margin-bottom:10px;height:36px}
.cta{position:absolute;left:0;right:0;bottom:0;padding:12px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(251,248,243,0),var(--bg) 30%)}
@media (max-width:599px){.cta{position:fixed;max-width:430px;margin:0 auto}}

/* 내 기록 */
.optgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tblwrap{overflow-x:auto;margin:10px -20px 0;padding:0 20px}
table.cmp{border-collapse:collapse;font-size:13px;min-width:560px;background:var(--surface);border-radius:12px;overflow:hidden}
table.cmp th,table.cmp td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}
table.cmp th{background:var(--card);font-weight:700;position:sticky;top:0}
table.cmp td:first-child,table.cmp th:first-child{position:sticky;left:0;background:var(--card);color:var(--ink2);font-weight:600}
table.cmp td.need{color:var(--need);font-weight:600}

/* 바텀시트 */
.scrim{position:fixed;inset:0;background:rgba(40,26,16,.42);display:none;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));max-height:86dvh;overflow-y:auto;transform:translateY(105%);transition:transform .28s ease;z-index:50}
.sheet.open{transform:none} .scrim.open{display:block}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:21px;margin:4px 0 6px}
.steps{display:flex;gap:6px;margin:12px 0 16px;font-size:12.5px;color:var(--ink2)}
.steps span{flex:1;background:var(--card);border-radius:10px;padding:8px;text-align:center}
.steps b{display:block;color:var(--blue);font-size:12px}
.sample{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.play{width:40px;height:40px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.sample .s{flex:1;min-width:0} .sample .s b{display:block;font-size:15px} .sample .s small{color:var(--muted)}
.go{font-size:13px;font-weight:700;color:var(--blue);padding:8px 4px;white-space:nowrap}
.recbox{margin-top:18px;padding:14px;border:1px dashed var(--line);border-radius:14px;text-align:center}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* 녹음 */
.recmain{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px 0 6px}
.bigmic{width:96px;height:96px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 10px 28px rgba(19,56,179,.35);transition:transform .15s}
.bigmic .ic{width:38px;height:38px}
.bigmic.on{background:var(--bad);box-shadow:0 0 0 10px rgba(180,35,44,.15),0 10px 28px rgba(180,35,44,.35);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(180,35,44,.06),0 10px 28px rgba(180,35,44,.35)}}
.rectime{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink2)}
.live{min-height:120px;max-height:34dvh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15.5px;line-height:1.6}
.live .interim{color:var(--muted)}
.live:empty::before{content:attr(data-ph);color:var(--muted)}
textarea.edit{width:100%;min-height:160px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:15.5px;line-height:1.6;background:var(--surface);color:var(--ink);resize:vertical}
textarea.edit:focus{outline:none;border-color:var(--blue)}
.hint{background:var(--blue-soft);color:var(--blue-ink);border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.btnrow{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:12px}
.btn.sm{height:50px;font-size:16px}
.mini{font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--blue-soft);color:var(--blue)}
.danger{color:var(--bad);font-weight:600;font-size:14px;padding:10px 0}
details.samples summary{list-style:none;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink2);padding:14px 0 4px}
.tip{font-size:12.5px;color:var(--ink2);margin:4px 0 0;padding-left:18px}
.tip li{margin:3px 0}
.kvgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding-top:12px}
.kv2{display:flex;flex-direction:column;font-size:13.5px} .kv2 span{font-size:12px;color:var(--ink2)} .kv2 b{font-weight:600}
.pricebox{margin-top:14px;padding:12px;background:var(--surface);border-radius:12px}
.pr{flex:1;display:flex;flex-direction:column} .pr span{font-size:12px;color:var(--ink2)} .pr b{font-size:22px;font-weight:800;letter-spacing:-.02em} .pr small{color:var(--muted);font-size:11.5px}
details.srcs{margin-top:10px;font-size:12.5px} details.srcs summary{cursor:pointer;color:var(--ink2);font-weight:600}
details.srcs a{display:block;color:var(--blue);padding:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spinner{width:36px;height:36px;margin:0 auto;border-radius:50%;border:4px solid var(--blue-soft);border-top-color:var(--blue);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gallery{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;height:230px;background:#ddd5c9}
.gallery .ph{position:relative;flex:0 0 100%;scroll-snap-align:center} .gallery img{width:100%;height:230px;object-fit:cover;display:block}
.gallery .ph:only-child{flex-basis:100%}
.phdel{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(40,26,16,.55);color:#fff;font-size:18px;line-height:1}
.mapbox{position:relative;height:200px} .mapbox iframe{width:100%;height:100%;border:0;display:block}
.mapbox .lbl{position:absolute;right:10px;bottom:8px;font-size:11px;background:rgba(255,255,255,.85);padding:2px 6px;border-radius:6px;color:var(--ink2)}
.photobar{display:flex;gap:8px;margin:12px 0 0;overflow-x:auto} .photobar .chip{display:inline-flex;align-items:center;height:34px;font-size:13.5px;cursor:pointer}
.steps2{margin:10px 0 12px;padding-left:20px;font-size:13.5px;color:var(--ink2)} .steps2 li{margin:4px 0}
</style>

<div class="phone">
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <a href="#/" data-t="home"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10v10a1 1 0 0 0 1 1h5v-6h6v6h5a1 1 0 0 0 1-1V10z"/></svg>홈</a>
    <a href="#/region" data-t="region"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>지역별 매물</a>
    <a href="#/records" data-t="records"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>내 기록</a>
  </nav>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script>
/* ───────── 데이터·설정 ───────── */
const D = window.ZIPNOTE_DATA || {properties: []};
const store = {
  get(k, d){ try { const v = localStorage.getItem('zipnote.'+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('zipnote.'+k, JSON.stringify(v)); return true; } catch(e){ toast('저장 공간이 부족해요'); return false; } }
};
let S = store.get('settings', {seed: 2, buyer: '무주택', income: 0, samples: true});
if (S.samples === undefined) S.samples = true;
const SAMPLES = D.properties.map(p => ({...p, sample: true}));
let MINE = store.get('mine', []);
// 예전 버전에서 저장한 매물: 단지명·동네 인식을 새 규칙으로 한 번 다시 채운다
(function upgradeOld(){
  let changed = false;
  for (const p of MINE) {
    if (p.complex_name === undefined && p.transcript) {
      const a = ZipEngine.analyze(p.transcript);
      p.complex_name = a.complex_name;
      if (!p.sido && a.sido) { p.sido = a.sido; p.sigungu = a.sigungu; p.zone = a.zone; }
      changed = true;
    }
  }
  if (changed) store.set('mine', MINE);
})();
let P = [], byId = {};
function reload(){
  P =MINE.slice().sort((a,b)=>b.created-a.created).concat(S.samples ? SAMPLES : []);
  byId = Object.fromEntries(MINE.concat(SAMPLES).map(p => [p.id, p]));
}
reload();
const recent = () => { const r = store.get('recent', []); const ids = P.map(p=>p.id); return r.filter(id=>ids.includes(id)).concat(ids.filter(id=>!r.includes(id))); };

/* 받아쓴 글 → 내 매물 저장 */
function saveNew(text){
  const a = ZipEngine.analyze(text);
  const p = {...a, id:'u'+Date.now(), sample:false, created:Date.now(), transcript:text, title:'내 임장'};
  MINE.push(p); store.set('mine', MINE); reload(); return p;
}
function mergeInto(id, text){
  const p = MINE.find(x=>x.id===id); if(!p) return saveNew(text);
  const a = ZipEngine.analyze(text);
  for (const [k,v] of Object.entries(a)) {
    if (k==='zone') continue;
    if (Array.isArray(v)) p[k] = [...new Set((p[k]||[]).concat(v))];
    else if (v != null) p[k] = v;          // 새 녹음에서 말한 값이 우선 (정정 반영)
  }
  p.transcript = (p.transcript||'') + '\n\n[추가 녹음] ' + text;
  const r = ZipEngine.normalizeRegion(p.sido, p.sigungu, p.dong, p.transcript);
  p.zone = ZipEngine.classify(r, p.transcript); p.updated = Date.now();
  store.set('mine', MINE); reload(); return p;
}

/* ───────── 자금 계산 (imjang/finance.py 와 같은 규칙) ───────── */
const SEED = {1:['1억 미만',0,10000],2:['1억~3억',10000,30000],3:['3억~5억',30000,50000],4:['5억~7억',50000,70000],5:['7억~10억',70000,100000],6:['10억 이상',100000,null]};
const BUYER = {'무주택':'무주택','생애최초':'생애최초','다주택':'2주택 이상'};
const INCOME = {0:['미입력',null],1:['3천만원 미만',2500],2:['3천~5천만원',3000],3:['5천~7천만원',5000],4:['7천만원~1억',7000],5:['1억 이상',10000]};
const LTV = {'true|무주택':.4,'false|무주택':.7,'true|생애최초':.7,'false|생애최초':.8};
const cap = p => p <= 150000 ? 60000 : p <= 250000 ? 40000 : 20000;
function dsrMax(inc){ const r=.045/12, n=360, m=inc*.4/12; return Math.floor(m*(1-Math.pow(1+r,-n))/r); }
function won(v){ if(v==null) return '확인 필요'; v=Math.round(v); const s=v<0?'-':''; v=Math.abs(v); const e=Math.floor(v/10000), m=v%10000;
  return s+(e&&m?`${e}억 ${m.toLocaleString()}만원`:e?`${e}억원`:`${m.toLocaleString()}만원`); }
function short(v){ if(v==null) return null; return v>=10000 ? (Math.round(v/1000)/10).toString()+'억' : v.toLocaleString()+'만'; }
function loanEst(price, regulated, buyer, inc){
  if(buyer==='다주택') return {amount:0, basis:'2주택 이상: 수도권 주택구입 목적 주담대 불가'};
  const ltv=LTV[`${!!regulated}|${buyer}`], parts=[[Math.floor(price*ltv),`LTV ${ltv*100}%`],[cap(price),'절대 한도']];
  const income=INCOME[inc][1]; if(income) parts.push([dsrMax(income),'DSR 40%']);
  const [amt]=parts.reduce((a,b)=>b[0]<a[0]?b:a);
  return {amount:amt, basis: parts.map(p=>`${p[1]} ${won(p[0])}`).join(' · ') + ` → ${won(amt)}` + (income?'':' (소득 미입력: DSR 미반영)')};
}
function judge(need, seed){
  const [name,low,high]=SEED[seed], short_=need-low;
  if(short_<=0) return {verdict:'가능', level:'ok'};
  const lv = short_<=10000 ? 'warn' : 'bad';
  return {verdict:(lv==='warn'?'조금 부족 ':'많이 부족 ')+won(short_), level:lv,
          note:(high==null||need<=high)?`시드가 구간 상단에 가까우면 가능`:''};
}
function finance(p){
  const z=p.zone, price=p.sale_price, j=p.jeonse_price, out=[];
  if(price==null) return {scen:[{name:'판정 불가', na:'매매가 확인 필요', level:'na'}]};
  const loan=loanEst(price, z.regulated, S.buyer, S.income);
  if(z.gap_allowed===true){
    if(j==null) out.push({name:'갭투자', na:'전세가 확인 필요', level:'na'});
    else { const need=price-j; out.push({name:'갭투자', need, ...judge(need,S.seed), detail:`매매 ${short(price)} − 전세 ${short(j)}`}); }
  } else if(z.gap_allowed===false) out.push({name:'갭투자', na:'불가 · 토허구역', level:'na', detail:'2년 실거주 의무'});
  const need=price-loan.amount;
  out.push({name:'실거주 매수', need, ...judge(need,S.seed), detail:`매매 ${short(price)} − 대출 추정 ${short(loan.amount)}`});
  const tips=[];
  if(S.buyer==='다주택') tips.push('다주택자는 수도권 주담대가 막혀 현금·전세 레버리지만 가능');
  else if(S.buyer==='생애최초') tips.push('생애최초 LTV 우대 — 디딤돌·보금자리론 해당 여부 은행 확인');
  else if(price<=60000) tips.push('6억 이하 → 보금자리론 대상 가능성, 시중은행 금리와 비교');
  else tips.push('한도 = LTV·절대 한도·DSR 중 가장 작은 값');
  if(z.zone==='A'||z.zone==='C') tips.push('토허구역: 허가 후 4개월 내 입주·2년 실거주 → 전세 끼고 매수 불가');
  if(p.seller_loan_exists && p.seller_loan_amount) tips.push(`매도인 융자 ${won(p.seller_loan_amount)} — 잔금 때 말소 조건 명시`);
  return {scen:out, basis:loan.basis, tips};
}
const best = f => { const order={ok:0,warn:1,bad:2,na:3}; return f.scen.slice().sort((a,b)=>order[a.level]-order[b.level])[0]; };

function region(q){

  if(!sidos.length) return `<h1 class="disp pagehd">지역별 매물</h1><div class="empty">지역이 확인된 매물이 아직 없어요.<br>녹음할 때 "서울 영등포구 당산동"처럼 지역을 말해 주세요.</div><button class="fab" data-act="rec" aria-label="녹음 시작">${I.mic}</button>`;
  const sido = q.sido && sidos.includes(q.sido) ? q.sido : sidos[0];
  const gus = [...new Set(P.filter(p=>p.sido===sido).map(gu))];
  const g = q.gu && gus.includes(q.gu) ? q.gu : gus[0];
  const inGu = P.filter(p=>p.sido===sido && gu(p)===g);
  const spots = [...new Set(inGu.map(spot))];
  const sp = q.spot && spots.includes(q.spot) ? q.spot : spots[0];
  const f = q.f || 'all';
  let list = inGu.filter(p=>spot(p)===sp);
  if(f==='gap') list = list.filter(p=>p.zone.gap_allowed===true);
  if(f==='ok') list = list.filter(p=>{ const b=best(finance(p)); return b.level==='ok'||b.level==='warn'; });
  const sel = (name, opts, cur) => `<select aria-label="${name}" data-q="${name}">${opts.map(o=>`<option value="${esc(o)}" ${o===cur?'selected':''}>${esc(name==='sido'?SIDO_SHORT[o]||o:o)}</option>`).join('')}</select>`;

}

/* ───────── 사진 (폰 IndexedDB에 저장) ───────── */
const PhotoDB = {
  db: null,
  open(){ return this.db || (this.db = new Promise((res, rej) => { const r = indexedDB.open('zipnote', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })); },
  async put(key, blob){ const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('photos','readwrite'); tx.objectStore('photos').put(blob, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); },
  async get(key){ const db = await this.open(); return new Promise((res) => { const q = db.transaction('photos').objectStore('photos').get(key); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); },
  async del(key){ const db = await this.open(); return new Promise((res) => { const tx = db.transaction('photos','readwrite'); tx.objectStore('photos').delete(key); tx.oncomplete = res; tx.onerror = res; }); },
};
function shrink(file, max = 1280){   // 저장 공간 절약: 긴 변 1280px JPEG
  return new Promise((res) => { const img = new Image(); img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height));
    const cv = Object.assign(document.createElement('canvas'), {width: Math.round(img.width*s), height: Math.round(img.height*s)});
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); cv.toBlob(b => { URL.revokeObjectURL(img.src); res(b || file); }, 'image/jpeg', 0.82); };
    img.onerror = () => res(file); img.src = URL.createObjectURL(file); });
}
async function addPhotos(id, files){
  const p = MINE.find(x=>x.id===id); if (!p || !files.length) return;
  p.photos = p.photos || [];
  for (const f of files) { const key = `${id}:${Date.now()}:${Math.random().toString(36).slice(2,6)}`; await PhotoDB.put(key, await shrink(f)); p.photos.push(key); }
  saveMine(); reload(); render(); toast(`사진 ${files.length}장을 붙였어요`);
}
const urlCache = {};
async function fillPhotos(){
  for (const el of document.querySelectorAll('img[data-photo]')) {
    const k = el.dataset.photo; if (!urlCache[k]) { const b = await PhotoDB.get(k); if (!b) continue; urlCache[k] = URL.createObjectURL(b); }
    el.src = urlCache[k];
  }
}
/* 단지 위치 → 지도 (OpenStreetMap, 키 불필요). 주소는 한 번만 찾아 저장 */
async function locate(p){
  if (p.geo !== undefined || !p.ai) return;
  const c = p.ai.complex || {};
  const qs = [c.address, [c.sigungu, c.dong, c.name].filter(Boolean).join(' '), [p.sigungu, nameOf(p)].filter(Boolean).join(' ')].filter(Boolean);
  p.geo = null;
  for (const q of qs) {
    try { const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&accept-language=ko&q=${encodeURIComponent(q)}`);
      const j = await r.json(); if (j && j[0]) { p.geo = {lat: +j[0].lat, lon: +j[0].lon}; break; } } catch(_) {}
  }
  saveMine(); rerenderIf(p.id);
}
function heroOf(p){
  const photos = p.photos || [];
  if (photos.length) return `<div class="gallery">${photos.map(k=>`<div class="ph"><img data-photo="${k}" alt="임장 사진"><button class="phdel" data-delphoto="${k}" data-id="${p.id}" aria-label="사진 삭제">×</button></div>`).join('')}</div>`;
  if (p.geo) { const {lat, lon} = p.geo, d = 0.006;
    return `<div class="mapbox"><iframe title="단지 위치 지도" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${lon-d},${lat-d*0.6},${lon+d},${lat+d*0.6}&layer=mapnik&marker=${lat},${lon}"></iframe>
      <span class="lbl">단지 위치 · © OpenStreetMap</span></div>`; }
  return `<div class="photo" aria-hidden="true" style="height:120px;display:grid;place-items:center"><span class="small muted">${p.ai ? '위치를 찾는 중이거나 찾지 못했어요' : '정리하면 단지 위치 지도가 여기에 떠요'}</span></div>`;
}

    <p class="fine">키는 이 폰에만 저장되고 Anthropic으로만 전송돼요. 매물 1건 정리에 약 300~500원(웹 검색 포함, 추정)이 들어요. 모델: ${ZipAI.MODEL}</p></section>`;
}

/* ───────── 바텀시트 ───────── */
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
function openSheet(html){ sheet.innerHTML = '<div class="grab"></div>'+html; sheet.classList.add('open'); scrim.classList.add('open'); }
function closeSheet(){ sheet.classList.remove('open'); scrim.classList.remove('open'); stopAudio(); abortRec(); }
scrim.onclick = closeSheet;
document.addEventListener('keydown', e => { if(e.key==='Escape') closeSheet(); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const REC = {sr:null, on:false, prev:'', final:'', start:0, timer:null, target:''};
/* 녹음 중 화면 꺼짐 방지 (Wake Lock) */
let wakeLock = null;
async function keepAwake(on){
  try {
    if (on && 'wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); }
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch(_) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && REC.on) { keepAwake(true); try { REC.sr && REC.sr.start(); } catch(_){} }
});
function saveDraft(){ store.set('draft', {text: REC.final, target: REC.target, t: Date.now()}); }

function recSheet(target){
  REC.target = target || ''; REC.prev = REC.final = '';
  const t = target && byId[target];
  const draft = store.get('draft', null);
  const useDraft = draft && draft.text && draft.text.trim().length > 3 && Date.now() - draft.t < 2*86400000 && (draft.target||'') === REC.target;
  setTimeout(() => { if (useDraft) { const ed = document.getElementById('edit'); ed.value = draft.text.trim(); document.getElementById('after').hidden = false; toast('끊겼던 녹음 내용을 불러왔어요'); } }, 50);
  openSheet(`<h3 class="disp">${t ? '녹음 추가' : '녹음으로 매물 남기기'}</h3>
  <p class="muted small" style="margin:0">${t ? esc(nameOf(t))+'에 대해 더 본 것을 말해 주세요. 기존 녹음과 합쳐서 다시 정리해요.' : '단지 이름과 본 것을 평소처럼 말하세요. 단지 정보와 시세는 AI가 찾아와요.'}</p>
  ${SR ? `<div class="recmain"><button class="bigmic" id="bigmic" data-act="mic" aria-label="녹음 시작">${I.mic}</button>
      <span class="rectime" id="rectime">눌러서 녹음 시작</span></div>
    <div class="live" id="live" data-ph="말하면 여기에 바로 글자로 나와요."></div>`
  : `<div class="hint">이 브라우저는 실시간 받아쓰기를 지원하지 않아요. 아래 칸을 누르고 <b>키보드의 🎤 음성 입력</b>으로 말하거나 직접 적어 주세요. (Chrome·Safari 최신 버전은 지원)</div>`}
  <div id="after" ${SR ? 'hidden' : ''}>
    <div class="sublbl">받아쓴 글 — 틀린 곳은 고칠 수 있어요</div>
    <textarea class="edit" id="edit" placeholder="예) 서울 영등포구 당산동 아파트 24평, 매매 7억 2천, 전세 4억 5천, 2008년식, 650세대, 당산역까지 걸어서 8분…"></textarea>
    <div class="btnrow"><button class="btn ghost sm" data-act="redo">${SR ? '다시 녹음' : '지우기'}</button><button class="btn sm" data-act="save">정리하기</button></div>
  </div>
  <details class="samples"><summary>말하기 팁 · 샘플 녹음 듣기</summary>
    <ul class="tip"><li>처음에 <b>단지 이름</b>을 말해 주세요 ("지금 문래자이 아파트 왔어")</li>
      <li>그다음은 편하게: 좋았던 점, 아쉬운 점, 하자, 관리 상태, 주변 느낌</li>
      <li>중개사에게 들은 <b>가격</b>이 있으면 말해 주세요. 없으면 최근 실거래가로 판정해요</li>
      <li>녹음 중엔 화면이 꺼지지 않게 유지돼요. 중간에 끊겨도 내용은 저장돼요</li></ul>
    ${SAMPLES.map(p=>`<div class="sample"><button class="play" data-play="${p.id}" aria-label="재생">${I.play}</button>
      <div class="s"><b>${esc(nameOf(p))}</b><small>AI 음성 샘플</small></div><a class="go" href="#/p/${p.id}">정리 결과 ›</a></div>`).join('')}
  </details>`);
}
function fmtTime(ms){ const s=Math.floor(ms/1000); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function startRec(){
  const ed = document.getElementById('edit');
  REC.prev = ed && ed.value.trim() ? ed.value.trim() + ' ' : '';   // 이어서 녹음하면 앞의 글(고친 글 포함) 뒤에 붙인다
  REC.final = REC.prev;
  const sr = new SR(); REC.sr = sr; REC.on = true; REC.start = Date.now();
  sr.lang = 'ko-KR'; sr.continuous = true; sr.interimResults = true;
  sr.onresult = e => {
    let fin = '', interim = '';
    for (let i = 0; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) fin += r[0].transcript + ' '; else interim += r[0].transcript; }
    REC.final = (REC.prev + fin).replace(/\s+/g,' ');
    saveDraft();
    const live = document.getElementById('live');
    if (live) { live.innerHTML = esc(REC.final) + `<span class="interim">${esc(interim)}</span>`; live.scrollTop = live.scrollHeight; }
  };
  sr.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { toast('마이크 권한을 허용해 주세요 (주소창 옆 🔒 → 마이크)'); finishRec(); }
    else if (e.error === 'audio-capture') { toast('마이크를 찾을 수 없어요'); finishRec(); }
    else if (e.error === 'network') { toast('음성인식은 인터넷 연결이 필요해요'); finishRec(); }
  };
  sr.onend = () => { if (REC.on) { REC.prev = REC.final + ' '; try { sr.start(); } catch(_){} } };   // 말이 끊기면 자동으로 다시 듣기
  try { sr.start(); } catch(e){ toast('녹음을 시작할 수 없어요'); REC.on = false; return; }
  keepAwake(true);
  const b = document.getElementById('bigmic'); b.classList.add('on'); b.setAttribute('aria-label','녹음 끝내기');
  b.innerHTML = '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>';
  document.getElementById('after').hidden = true;
  REC.timer = setInterval(()=>{ const el=document.getElementById('rectime'); if(el) el.innerHTML = `<span class="recdot"></span>듣는 중 ${fmtTime(Date.now()-REC.start)}${wakeLock?' · 화면 켜짐 유지':''} · 다 말했으면 ■`; }, 300);
}
function abortRec(){ REC.on = false; clearInterval(REC.timer); keepAwake(false); if (REC.sr) { try { REC.sr.abort(); } catch(_){} REC.sr = null; } }
function finishRec(){
  const wasOn = REC.on; abortRec();
  const b = document.getElementById('bigmic'); if (!b) return;
  b.classList.remove('on'); b.innerHTML = I.mic; b.setAttribute('aria-label','다시 녹음');
  document.getElementById('rectime').textContent = wasOn ? `녹음 ${fmtTime(Date.now()-REC.start)} · 다시 누르면 이어서 녹음` : '눌러서 녹음 시작';
  const ed = document.getElementById('edit'); ed.value = REC.final.trim();
  document.getElementById('after').hidden = false;
  if (!ed.value) ed.placeholder = '들린 말이 없어요. 다시 녹음하거나 직접 적어 주세요.';
}
function saveRec(){
  const text = (document.getElementById('edit').value || '').trim();
  if (text.length < 4) { toast('정리할 내용이 없어요'); return; }
  const p = REC.target ? mergeInto(REC.target, text) : saveNew(text);
  store.set('draft', null);
  closeSheet(); location.hash = '#/p/' + p.id;
  runAI(p.id);
}

/* ───────── AI 정리 실행 ───────── */
const RUNNING = new Set();
function saveMine(){ store.set('mine', MINE); }
function rerenderIf(id){ const {parts} = parse(); if (parts[0]==='p' && parts[1]===id) render(); }
async function runAI(id){
  const p = MINE.find(x=>x.id===id); if (!p || RUNNING.has(id)) return;
  const key = store.get('apikey','');
  if (!key) { p.status = 'handoff'; saveMine(); reload(); rerenderIf(id); return; }   // 키 없으면 Claude·ChatGPT 넘겨주기
  RUNNING.add(id); p.status = 'analyzing'; p.step = '단지를 찾고 있어요'; p.error = null; saveMine(); reload(); rerenderIf(id);
  try {
    const r = await ZipAI.analyze(key, p.transcript, step => { p.step = step; saveMine(); rerenderIf(id); });
    applyReport(p, r); p.status = 'done';
    toast('정리 완료');
  } catch(e) { p.status = 'error'; p.error = ZipAI.friendlyError(e); }
  finally { RUNNING.delete(id); saveMine(); reload(); rerenderIf(id); }
}
function applyReport(p, r){
  const c = r.complex || {}, m = r.market || {}, v = r.visit || {};
  p.ai = r; p.geo = undefined;   // 새 단지 정보로 지도 위치를 다시 찾는다
  if (c.name) p.complex_name = c.name;
  p.sido = c.sido || p.sido; p.sigungu = c.sigungu || p.sigungu; p.dong = c.dong || p.dong;
  p.property_type = p.property_type || '아파트';
  p.area_pyeong = v.said_area_pyeong ?? m.area_pyeong ?? p.area_pyeong;
  p.sale_price = v.said_sale ?? m.sale_recent ?? null;   p.sale_src = v.said_sale != null ? '녹음' : m.sale_recent != null ? '실거래' : null;
  p.jeonse_price = v.said_jeonse ?? m.jeonse_recent ?? null; p.jeonse_src = v.said_jeonse != null ? '녹음' : m.jeonse_recent != null ? '실거래' : null;
  for (const [k, ck] of [['households','households'],['built_year','built_year'],['parking_per_household','parking_per_household'],['station_name','nearest_station'],['station_walk_min','station_walk_min']])
    p[k] = c[ck] ?? p[k] ?? null;
  p.defects = v.defects || [];
  const reg = ZipEngine.normalizeRegion(p.sido, p.sigungu, p.dong, [c.address, p.transcript].filter(Boolean).join(' '));
  p.sido = reg.sido || p.sido;
  p.zone = ZipEngine.classify(reg, [c.address, p.dong].filter(Boolean).join(' '));
}
// 앱을 다시 열었을 때 '정리 중'으로 멈춘 매물은 다시 시도할 수 있게
for (const p of MINE) if (p.status === 'analyzing') { p.status = 'error'; p.error = '정리가 중간에 멈췄어요. 다시 시도해 주세요.'; }
saveMine();
function backup(){
  const url = URL.createObjectURL(new Blob([JSON.stringify(MINE, null, 1)], {type:'application/json'}));
  const a = Object.assign(document.createElement('a'), {href:url, download:`zipnote_backup_${new Date().toISOString().slice(0,10)}.json`});
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function settingsSheet(){
  openSheet(`<h3 class="disp">내 조건</h3>${records().split('<h2 class="sec">')[0].replace(/<h1[\s\S]*?<\/h1>/,'').replace('style="margin-top:4px"','style="margin-top:0;background:transparent;padding:0"')}
  <button class="btn" data-act="close" style="margin-top:14px">적용</button>`);
}

let audioEl = null, audioBtn = null;
function stopAudio(){ if(audioEl){ audioEl.pause(); audioEl=null; } if(audioBtn){ audioBtn.innerHTML=I.play; audioBtn=null; } }
function togglePlay(btn){
  const id = btn.dataset.play; const same = audioBtn===btn; stopAudio(); if(same) return;
  audioEl = new Audio(byId[id].audio); audioBtn = btn; btn.innerHTML = I.pause;
  audioEl.onended = stopAudio; audioEl.play().catch(()=>{ toast('음성 파일을 열 수 없어요'); stopAudio(); });
}
let tt; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2200); }

/* ───────── 라우터 · 이벤트 ───────── */
function parse(){ const [path,qs] = (location.hash.slice(1)||'/').split('?'); return {parts:path.split('/').filter(Boolean), q:Object.fromEntries(new URLSearchParams(qs||''))}; }
function setQ(patch){ const {parts,q} = parse(); const n={...q,...patch}; Object.keys(n).forEach(k=>n[k]==null&&delete n[k]); location.hash = '#/'+parts.join('/')+'?'+new URLSearchParams(n); }
function render(){
  const {parts,q} = parse(), v = document.getElementById('view');
  const tab = parts[0]==='region'?'region':parts[0]==='records'?'records':parts[0]==='p'?'':'home';
  v.innerHTML = parts[0]==='region'?region(q):parts[0]==='records'?records():parts[0]==='p'?detail(parts[1]):home();
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on', a.dataset.t===tab));
  document.getElementById('tabs').style.display = parts[0]==='p' ? 'none' : '';
  if(q.ai){ const c=document.getElementById('aicard'); if(c){ c.scrollIntoView({block:'center'}); document.getElementById('apikey').focus(); } }
  else if(!q.keep){ v.scrollTop = 0; window.scrollTo(0,0); }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-sido],[data-grp],[data-spot],[data-f],[data-set],[data-play],[data-del],[data-rename],[data-delphoto]'); if(!t) return;
  if(t.dataset.delphoto){ const p=MINE.find(x=>x.id===t.dataset.id); if(p && confirm('이 사진을 지울까요?')){ p.photos=(p.photos||[]).filter(k=>k!==t.dataset.delphoto); PhotoDB.del(t.dataset.delphoto); saveMine(); reload(); render(); } return; }
  if(t.dataset.rename){ const p=MINE.find(x=>x.id===t.dataset.rename); if(!p) return;
    const v=prompt('매물 이름 (예: 문래자이 32평)', nameOf(p)); if(v!=null){ p.custom_name=v.trim()||null; store.set('mine',MINE); reload(); render(); toast('이름을 바꿨어요'); } return; }
  if(t.dataset.act==='rec') recSheet(t.dataset.target);
  else if(t.dataset.act==='settings') settingsSheet();
  else if(t.dataset.act==='close') closeSheet();
  else if(t.dataset.act==='mic') REC.on ? finishRec() : startRec();
  else if(t.dataset.act==='redo'){ document.getElementById('edit').value=''; REC.prev = REC.final = ''; const l=document.getElementById('live'); if(l) l.innerHTML=''; if(SR) startRec(); }
  else if(t.dataset.act==='save') saveRec();
  else if(t.dataset.act==='backup') backup();
  else if(t.dataset.act==='reai'){ if(!store.get('apikey','')){ const p=MINE.find(x=>x.id===t.dataset.id); if(p){ p.ai=null; p.status='handoff'; saveMine(); reload(); render(); } } else runAI(t.dataset.id); }
  else if(t.dataset.act==='handoff'){
    const p = MINE.find(x=>x.id===t.dataset.id); if(!p) return;
    const prompt = ZipAI.handoffPrompt(p.transcript), enc = encodeURIComponent(prompt);
    const base = t.dataset.to==='claude' ? 'https://claude.ai/new' : 'https://chatgpt.com/';
    const url = enc.length < 12000 ? `${base}?q=${enc}` : base;   // 너무 길면 빈 대화를 열고 붙여넣기
    const copy = navigator.clipboard ? navigator.clipboard.writeText(prompt) : Promise.reject();
    copy.then(()=>toast('질문을 복사했어요 · 열리는 앱에 붙여넣기 하세요'), ()=>toast('복사가 안 되면 녹음 원문을 직접 복사해 주세요'));
    window.open(url, '_blank', 'noopener');
  }
  else if(t.dataset.act==='apply-paste'){
    const p = MINE.find(x=>x.id===t.dataset.id); const txt = (document.getElementById('paste').value||'').trim();
    if(!p || !txt){ toast('답을 먼저 붙여넣어 주세요'); return; }
    try { const r = ZipAI.parseHandoff(txt); applyReport(p, r); p.status='done'; p.error=null; saveMine(); reload(); render(); toast('정리 완료'); }
    catch(e){ toast(e.message); }
  }
  else if(t.dataset.act==='aikey-save'){ const v=document.getElementById('apikey').value.trim(); store.set('apikey', v); toast(v?'키를 저장했어요':'키를 지웠어요');
    MINE.filter(p=>p.status==='nokey').forEach(p=>runAI(p.id)); }
  else if(t.dataset.act==='aikey-test'){ const v=document.getElementById('apikey').value.trim(); if(!v){ toast('키를 먼저 넣어 주세요'); return; }
    t.textContent='확인 중…'; ZipAI.testKey(v).then(()=>{ toast('연결됐어요 ✓'); store.set('apikey', v); }).catch(e=>toast(ZipAI.friendlyError(e))).finally(()=>{ t.textContent='연결 확인'; }); }
  else if(t.dataset.del){ if(confirm('이 매물을 삭제할까요? 이 폰에서 지워지고 되돌릴 수 없어요.')){ removeMine(t.dataset.del); location.hash='#/'; toast('삭제했어요'); } }
  else if(t.dataset.sido){ store.set('homeSido', t.dataset.sido); render(); }
  else if(t.dataset.grp){ const open = t.getAttribute('aria-expanded')==='true'; t.setAttribute('aria-expanded', !open); document.getElementById('grp'+t.dataset.grp).hidden = open; }
  else if(t.dataset.spot) setQ({spot:t.dataset.spot});
  else if(t.dataset.f) setQ({f:t.dataset.f, keep:1});
  else if(t.dataset.play) togglePlay(t);
  else if(t.dataset.set){ const k=t.dataset.set; S[k] = k==='buyer' ? t.dataset.v : k==='samples' ? t.dataset.v==='1' : +t.dataset.v; store.set('settings', S); reload();
    if(sheet.classList.contains('open')) settingsSheet(); render(); toast('조건을 바꿨어요 · 판정이 다시 계산됐어요'); }
});
document.addEventListener('change', e => {
  const up = e.target.closest('input[data-addphoto]'); if (up) { addPhotos(up.dataset.addphoto, [...up.files]).catch(()=>toast('사진을 저장하지 못했어요')); return; }
  const s=e.target.closest('select[data-q]'); if(!s) return;
  setQ(s.dataset.q==='sido' ? {sido:s.value, gu:null, spot:null} : {gu:s.value, spot:null}); });
window.addEventListener('hashchange', () => { closeSheet(); render(); });
render();
</script>
